# Hooks Git du dépôt — installer avec :  make install-hooks   (ou ./scripts/install-hooks.sh)
# `default_install_hook_types` installe les 3 types (pre-commit, commit-msg, pre-push)
# en une seule commande `pre-commit install`.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

exclude: '(_pb2\.py|_pb2_grpc\.py|/migrations/)'

repos:
  # Garde-fou secrets : refuse tout fichier .env au commit (seul .env.example est suivi).
  - repo: local
    hooks:
      - id: forbid-dotenv
        name: "Interdiction de committer un .env (secrets)"
        language: fail
        entry: "Refus : un fichier .env contient des secrets et ne doit jamais etre commite. Utilisez .env.example. Deja suivi ? git rm --cached <fichier>."
        files: '(^|/)\.env(\.[^/]*)?$'
        exclude: '\.example$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # --- Au commit : lint + format avec correction automatique ---
      - id: ruff
        args: [--fix]
      - id: ruff-format
      # --- Au push : garde-fou STRICT (aucune correction, échoue si non conforme) ---
      - id: ruff
        alias: ruff-strict-pre-push
        name: ruff (strict, pre-push)
        args: [--no-fix]
        stages: [pre-push]
      - id: ruff-format
        alias: ruff-format-check-pre-push
        name: ruff-format --check (pre-push)
        args: [--check]
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict

  # Valide le message de commit (Conventional Commits)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.4
    hooks:
      - id: commitizen
        stages: [commit-msg]
