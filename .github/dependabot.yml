version: 2

updates:
  # --- Images Docker : chaque service a son propre Dockerfile pinné par
  # digest (voir docs/ETAT_DU_SYSTEME.md) — Dependabot ouvre une PR pour
  # avancer le digest quand l'image amont publie un correctif de sécurité.
  - package-ecosystem: docker
    directory: /gateway
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /services/auth
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /services/abonne
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /services/campagne
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /services/facturation
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /services/paiement
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /services/notification
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /services/config
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /nginx
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /whatsapp-service
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # --- Dépendances Python : chaque service gère son propre
  # requirements.txt (indépendant par conception, voir CLAUDE.md racine).
  - package-ecosystem: pip
    directory: /gateway
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /services/auth
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /services/abonne
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /services/campagne
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /services/facturation
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /services/paiement
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /services/notification
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /services/config
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # --- Dépendances Node.js (whatsapp-service)
  - package-ecosystem: npm
    directory: /whatsapp-service
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # --- Actions GitHub utilisées dans le pipeline CI, épinglées par SHA
  # (voir .github/workflows/ci.yml) — Dependabot avance le SHA et le
  # commentaire de version ensemble.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
