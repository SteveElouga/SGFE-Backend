      - name: Analyse statique de sécurité (bandit)
        run: bandit -r . --exclude ./proto,./abonnes/migrations -ll
      - name: Tests + couverture
        run: |
          coverage run --source=abonnes manage.py test abonnes
          coverage report -m --fail-under=80

  test-campagne:
    needs: changes
    if: needs.changes.outputs.campagne == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/campagne
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/campagne/requirements.txt
      - run: pip install -r requirements.txt ruff==0.15.20 coverage pip-audit bandit
      - name: Lint (ruff)
