          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORCE_POSTGRES_TESTS: "True"
      ABONNE_DB_HOST: localhost
      ABONNE_DB_PORT: "5432"
      ABONNE_DB_NAME: abonne_db
      ABONNE_DB_USER: abonne_user
      ABONNE_DB_PASSWORD: ci-postgres-password
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/abonne/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.15.20 coverage pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Analyse statique de sécurité (bandit)
        run: bandit -r . --exclude ./proto,./abonnes/migrations -ll
      - name: Génère une clé Fernet éphémère (CI uniquement, jamais committée)
        run: echo "PII_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
      - name: Vérification des types (mypy --strict)
        run: mypy --strict --show-traceback abonnes/
      - name: Tests + couverture
        run: |
          coverage run --source=abonnes manage.py test abonnes
          coverage report -m --fail-under=80

