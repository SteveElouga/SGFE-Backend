name: CI

on:

  push:

  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Secrets FACTICES — uniquement pour permettre aux tests CI de démarrer (les
# settings exigent désormais DJANGO_SECRET_KEY, sans valeur par défaut). Jamais
# de vraies valeurs ici : les vrais secrets vivent dans l'environnement de
# déploiement (coffre / secrets manager). Le JWT RS256 utilise une paire de clés
# éphémère générée en mémoire pendant les tests (voir services/auth/auth/settings.py).
env:
  DJANGO_SECRET_KEY: ci-not-a-real-secret-key-for-tests-only
  # Même raison : l'authentification de la couche gRPC interne est fail-closed,
  # et les clients refusent de s'instancier sans clé. C'est le comportement
  # voulu — un service qui démarre sans secret serait un service ouvert — mais
  # il vaut aussi pour la CI, qui est un environnement comme un autre.
  INTERNAL_GRPC_KEY: ci-not-a-real-grpc-key-for-tests-only
  # PII_ENCRYPTION_KEY n'est PAS ici : contrairement aux deux secrets ci-dessus,
  # un token Fernet valide est forcément une chaîne à haute entropie (32 octets
  # aléatoires en base64) — même factice, un littéral commité de cette forme
  # déclenche à raison le scanner de secrets (gitleaks) qui ne peut pas
  # distinguer "vraie clé" de "clé de test qui a la même forme". Générée à la
  # volée dans le job test-abonne, seul consommateur (voir plus bas).
  # Même raison, pour auth-service et notification-service : DJANGO_DEBUG
  # n'étant pas positionné ici, ces settings tournent en DEBUG=False, ce qui
  # exige FRONTEND_URL sans repli (le service refuse un défaut silencieux sur
  # localhost en dehors du dev — voir settings.py). `.invalid` (RFC 2606) :
  # jamais censé résoudre, jamais confondu avec un vrai domaine.
  FRONTEND_URL: http://ci.invalid

jobs:

  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      abonne: ${{ steps.filter.outputs.abonne }}
      campagne: ${{ steps.filter.outputs.campagne }}
      facturation: ${{ steps.filter.outputs.facturation }}
      paiement: ${{ steps.filter.outputs.paiement }}
      notification: ${{ steps.filter.outputs.notification }}
      reporting: ${{ steps.filter.outputs.reporting }}
      config: ${{ steps.filter.outputs.config }}
      nginx: ${{ steps.filter.outputs.nginx }}
      whatsapp: ${{ steps.filter.outputs.whatsapp }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth/**'
              - 'proto/auth_service.proto'
            gateway:
              - 'gateway/**'
              - 'proto/**'
            abonne:
              - 'services/abonne/**'
              - 'proto/abonne_service.proto'
            campagne:
              - 'services/campagne/**'
              - 'proto/campagne_service.proto'
              - 'proto/abonne_service.proto'
              - 'proto/facturation_service.proto'
            facturation:
              - 'services/facturation/**'
              - 'proto/facturation_service.proto'
              - 'proto/campagne_service.proto'
              - 'proto/config_service.proto'
              - 'proto/paiement_service.proto'
              - 'proto/abonne_service.proto'
            paiement:
              - 'services/paiement/**'
              - 'proto/paiement_service.proto'
              - 'proto/facturation_service.proto'
              - 'proto/abonne_service.proto'
              - 'proto/config_service.proto'
            notification:
              - 'services/notification/**'
              - 'proto/notification_service.proto'
              - 'proto/facturation_service.proto'
              - 'proto/abonne_service.proto'
              - 'proto/config_service.proto'
            reporting:
              - 'services/reporting/**'
              - 'proto/reporting_service.proto'
            config:
              - 'services/config/**'
              - 'proto/config_service.proto'
            nginx:
              - 'nginx/**'
            whatsapp:
              - 'whatsapp-service/**'

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tourne toujours, indépendamment du path-filter ci-dessus : une dérive entre
  # la source canonique (libs/sgfe_common/) et une seule des 9 copies ne
  # toucherait qu'un seul dossier services/*, donc pas forcément celui qui a
  # changé dans le commit qui introduit la dérive. Un job gardé par path-filter
  # aurait laissé passer exactement l'incident du 04/09 (deux campagnes mypy
  # ayant chacune corrigé la copie de leurs 3 services sans jamais reporter le
  # correctif vers la source canonique — sync-grpc-lib.sh --check ne tournait
  # nulle part en CI pour l'attraper).
  check-grpc-lib-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Vérifie l'absence de dérive (sync-grpc-lib.sh --check)
        run: ./scripts/sync-grpc-lib.sh --check

  test-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    # PostgreSQL 16 — même moteur qu'en production (docker-compose.yml utilise
    # postgres:16-alpine) plutôt que le SQLite en mémoire des tests locaux.
    # settings.py bascule sur Postgres quand FORCE_POSTGRES_TESTS est vrai ;
    # par défaut (dev local) il reste sur SQLite pour un cycle rapide.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_user -d auth_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORCE_POSTGRES_TESTS: "True"
      AUTH_DB_HOST: localhost
      AUTH_DB_PORT: "5432"
      AUTH_DB_NAME: auth_db
      AUTH_DB_USER: auth_user
      AUTH_DB_PASSWORD: ci-postgres-password
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/auth/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.15.20 coverage pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Génère une paire de clés JWT RS256 éphémère (mypy importe settings.py hors du mode TESTING de manage.py test, qui génère la sienne en mémoire — sans ce fichier, l'import échoue en CI où keys/ n'existe pas)
        run: ../../scripts/gen-jwt-keys.sh keys
      - name: Vérification des types (mypy --strict)
        run: mypy --strict --show-traceback comptes/
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Analyse statique de sécurité (bandit)
        run: bandit -r . --exclude ./proto,./comptes/migrations -ll
      - name: Tests + couverture
        run: |
          coverage run --source=comptes manage.py test comptes
          coverage report -m --fail-under=80

  test-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.15.20 coverage pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Vérification des types (mypy --strict)
        run: mypy --strict --show-traceback schema/
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Analyse statique de sécurité (bandit)
        run: bandit -r . --exclude ./proto -ll
      - name: Tests + couverture
        run: |
          coverage run --source=schema manage.py test schema
          coverage report -m --fail-under=80

  test-abonne:
    needs: changes
    if: needs.changes.outputs.abonne == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/abonne
    # PostgreSQL 16 — voir le commentaire équivalent sur test-auth.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: abonne_db
          POSTGRES_USER: abonne_user
