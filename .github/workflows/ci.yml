          coverage report -m --fail-under=80

  test-paiement:
    needs: changes
    if: needs.changes.outputs.paiement == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/paiement
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/paiement/requirements.txt
      - run: pip install -r requirements.txt ruff==0.15.20 coverage pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Analyse statique de sécurité (bandit)
