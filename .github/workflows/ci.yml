      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/notification
          push: false
          load: true
          tags: notification-service:ci
          cache-from: type=gha,scope=notification-service
