name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Secrets FACTICES — uniquement pour permettre aux tests CI de démarrer (les
# settings exigent désormais DJANGO_SECRET_KEY, sans valeur par défaut). Jamais
# de vraies valeurs ici : les vrais secrets vivent dans l'environnement de
# déploiement (coffre / secrets manager). Le JWT RS256 utilise une paire de clés
# éphémère générée en mémoire pendant les tests (voir services/auth/auth/settings.py).
env:
  DJANGO_SECRET_KEY: ci-not-a-real-secret-key-for-tests-only
  # Même raison : l'authentification de la couche gRPC interne est fail-closed,
  # et les clients refusent de s'instancier sans clé. C'est le comportement
  # voulu — un service qui démarre sans secret serait un service ouvert — mais
  # il vaut aussi pour la CI, qui est un environnement comme un autre.
  INTERNAL_GRPC_KEY: ci-not-a-real-grpc-key-for-tests-only

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      abonne: ${{ steps.filter.outputs.abonne }}
      campagne: ${{ steps.filter.outputs.campagne }}
      facturation: ${{ steps.filter.outputs.facturation }}
      paiement: ${{ steps.filter.outputs.paiement }}
      notification: ${{ steps.filter.outputs.notification }}
      reporting: ${{ steps.filter.outputs.reporting }}
      nginx: ${{ steps.filter.outputs.nginx }}
      whatsapp: ${{ steps.filter.outputs.whatsapp }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth/**'
              - 'proto/auth_service.proto'
            gateway:
              - 'gateway/**'
              - 'proto/**'
            abonne:
              - 'services/abonne/**'
              - 'proto/abonne_service.proto'
            campagne:
              - 'services/campagne/**'
              - 'proto/campagne_service.proto'
              - 'proto/abonne_service.proto'
              - 'proto/facturation_service.proto'
            facturation:
              - 'services/facturation/**'
              - 'proto/facturation_service.proto'
              - 'proto/campagne_service.proto'
              - 'proto/config_service.proto'
              - 'proto/paiement_service.proto'
              - 'proto/abonne_service.proto'
            paiement:
              - 'services/paiement/**'
              - 'proto/paiement_service.proto'
              - 'proto/facturation_service.proto'
              - 'proto/abonne_service.proto'
              - 'proto/config_service.proto'
            notification:
              - 'services/notification/**'
              - 'proto/notification_service.proto'
              - 'proto/facturation_service.proto'
              - 'proto/abonne_service.proto'
              - 'proto/config_service.proto'
            reporting:
              - 'services/reporting/**'
              - 'proto/reporting_service.proto'
            nginx:
              - 'nginx/**'
            whatsapp:
              - 'whatsapp-service/**'

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/auth/requirements.txt
      - run: pip install -r requirements.txt ruff==0.15.20 coverage pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Analyse statique de sécurité (bandit)
        run: bandit -r . --exclude ./proto,./comptes/migrations -ll
      - name: Tests + couverture
        run: |
          coverage run --source=comptes manage.py test comptes
          coverage report -m --fail-under=80

  test-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
