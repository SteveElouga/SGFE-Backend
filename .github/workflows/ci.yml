    if: needs.changes.outputs.abonne == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_publish-image.yml
    with:
      service: abonne-service
      context: services/abonne

  publish-facturation:
    needs: [changes, test-facturation, secrets-scan]
    if: needs.changes.outputs.facturation == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_publish-image.yml
    with:
      service: facturation-service
      context: services/facturation

  publish-campagne:
    needs: [changes, test-campagne, secrets-scan]
    if: needs.changes.outputs.campagne == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_publish-image.yml
    with:
      service: campagne-service
      context: services/campagne

  publish-paiement:
    needs: [changes, test-paiement, secrets-scan]
    if: needs.changes.outputs.paiement == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_publish-image.yml
    with:
