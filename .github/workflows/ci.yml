name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      abonne: ${{ steps.filter.outputs.abonne }}
      nginx: ${{ steps.filter.outputs.nginx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth/**'
              - 'proto/auth_service.proto'
            gateway:
              - 'gateway/**'
              - 'proto/**'
            abonne:
              - 'services/abonne/**'
              - 'proto/abonne_service.proto'
            nginx:
              - 'nginx/**'

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/auth/requirements.txt
      - run: pip install -r requirements.txt ruff coverage pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Analyse statique de sécurité (bandit)
        run: bandit -r . --exclude ./proto,./comptes/migrations -ll
      - name: Tests + couverture
        run: |
          coverage run --source=comptes manage.py test comptes
          coverage report -m --fail-under=80

  test-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - run: pip install -r requirements.txt ruff coverage pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Analyse statique de sécurité (bandit)
        run: bandit -r . --exclude ./proto -ll
      - name: Tests + couverture
        run: |
          coverage run --source=schema manage.py test schema
          coverage report -m --fail-under=80

  test-abonne:
    needs: changes
    if: needs.changes.outputs.abonne == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/abonne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/abonne/requirements.txt
      - run: pip install -r requirements.txt ruff coverage pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Analyse statique de sécurité (bandit)
        run: bandit -r . --exclude ./proto,./abonnes/migrations -ll
      - name: Tests + couverture
        run: |
          coverage run --source=abonnes manage.py test abonnes
          coverage report -m --fail-under=80

  docker-build-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/auth
          push: false

  docker-build-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: gateway
          push: false

  docker-build-abonne:
    needs: changes
    if: needs.changes.outputs.abonne == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/abonne
          push: false

  docker-build-nginx:
    needs: changes
    if: needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: nginx
          push: false

  # Job agrégateur : seul check à déclarer "required" dans la protection de
  # branche. Les jobs test-auth/test-gateway sont conditionnels (skip si le
  # service n'a pas changé) — les déclarer "required" individuellement
  # bloquerait indéfiniment toute PR qui ne les déclenche pas.
  ci-status:
    if: always()
    needs: [secrets-scan, test-auth, test-gateway, test-abonne]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifie qu'aucun job requis n'a échoué
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "Au moins un job a échoué."
            exit 1
          fi

  # Publication des images sur GHCR : uniquement sur main/develop (jamais sur
  # les PR/feature branches), une fois les tests/scans passés.
  publish-auth:
    needs: [changes, test-auth, secrets-scan]
    if: needs.changes.outputs.auth == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Mettre le nom du dépôt en minuscules
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/auth
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/auth-service:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LC }}/auth-service:${{ github.sha }}

  publish-gateway:
    needs: [changes, test-gateway, secrets-scan]
    if: needs.changes.outputs.gateway == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Mettre le nom du dépôt en minuscules
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: gateway
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/gateway:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LC }}/gateway:${{ github.sha }}

  publish-abonne:
    needs: [changes, test-abonne, secrets-scan]
    if: needs.changes.outputs.abonne == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Mettre le nom du dépôt en minuscules
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/abonne
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/abonne-service:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LC }}/abonne-service:${{ github.sha }}

  publish-nginx:
    needs: [changes, secrets-scan]
    if: needs.changes.outputs.nginx == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Mettre le nom du dépôt en minuscules
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: nginx
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/nginx:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LC }}/nginx:${{ github.sha }}
