  # Job agrégateur : seul check à déclarer "required" dans la protection de
  # branche. Les jobs test-auth/test-gateway sont conditionnels (skip si le
  # service n'a pas changé) — les déclarer "required" individuellement
  # bloquerait indéfiniment toute PR qui ne les déclenche pas.
  ci-status:
    if: always()
    needs: [secrets-scan, check-grpc-lib-drift, test-auth, test-gateway, test-abonne, test-campagne, test-facturation, test-paiement, test-notification, test-reporting, test-config]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifie qu'aucun job requis n'a échoué
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "Au moins un job a échoué."
            exit 1
          fi

  # Publication des images sur GHCR : uniquement sur main/develop (jamais sur
  # les PR/feature branches), une fois les tests/scans passés. Réutilise le
  # cache GHA du job docker-build-* correspondant (même scope), génère un
  # SBOM + attestation de provenance, et signe l'image en keyless via
  # l'identité OIDC de GitHub Actions (cosign, sigstore public good instance).
  publish-auth:
    needs: [changes, test-auth, secrets-scan]
    if: needs.changes.outputs.auth == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_publish-image.yml
    with:
      service: auth-service
      context: services/auth

  publish-config:
    needs: [changes, test-config, secrets-scan]
    if: needs.changes.outputs.config == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_publish-image.yml
    with:
      service: config-service
      context: services/config

  publish-reporting:
    needs: [changes, test-reporting, secrets-scan]
    if: needs.changes.outputs.reporting == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_publish-image.yml
    with:
      service: reporting-service
      context: services/reporting

  publish-gateway:
    needs: [changes, test-gateway, secrets-scan]
    if: needs.changes.outputs.gateway == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_publish-image.yml
    with:
      service: gateway
      context: gateway

  publish-abonne:
    needs: [changes, test-abonne, secrets-scan]
    if: needs.changes.outputs.abonne == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
