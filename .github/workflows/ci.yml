name: CI

on:

  push:

  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Secrets FACTICES — uniquement pour permettre aux tests CI de démarrer (les
# settings exigent désormais DJANGO_SECRET_KEY, sans valeur par défaut). Jamais
# de vraies valeurs ici : les vrais secrets vivent dans l'environnement de
# déploiement (coffre / secrets manager). Le JWT RS256 utilise une paire de clés
# éphémère générée en mémoire pendant les tests (voir services/auth/auth/settings.py).
env:
  DJANGO_SECRET_KEY: ci-not-a-real-secret-key-for-tests-only
  # Même raison : l'authentification de la couche gRPC interne est fail-closed,
  # et les clients refusent de s'instancier sans clé. C'est le comportement
  # voulu — un service qui démarre sans secret serait un service ouvert — mais
  # il vaut aussi pour la CI, qui est un environnement comme un autre.
  INTERNAL_GRPC_KEY: ci-not-a-real-grpc-key-for-tests-only
  # PII_ENCRYPTION_KEY n'est PAS ici : contrairement aux deux secrets ci-dessus,
  # un token Fernet valide est forcément une chaîne à haute entropie (32 octets
  # aléatoires en base64) — même factice, un littéral commité de cette forme
  # déclenche à raison le scanner de secrets (gitleaks) qui ne peut pas
  # distinguer "vraie clé" de "clé de test qui a la même forme". Générée à la
  # volée dans chaque job qui en a besoin — matrice `test`, combinaisons
  # abonne et notification (voir plus bas) — jamais partagée entre jobs.
  # Même raison, pour auth-service et notification-service : DJANGO_DEBUG
  # n'étant pas positionné ici, ces settings tournent en DEBUG=False, ce qui
  # exige FRONTEND_URL sans repli (le service refuse un défaut silencieux sur
  # localhost en dehors du dev — voir settings.py). `.invalid` (RFC 2606) :
  # jamais censé résoudre, jamais confondu avec un vrai domaine.
  FRONTEND_URL: http://ci.invalid

jobs:

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      abonne: ${{ steps.filter.outputs.abonne }}
      campagne: ${{ steps.filter.outputs.campagne }}
      facturation: ${{ steps.filter.outputs.facturation }}
      paiement: ${{ steps.filter.outputs.paiement }}
      notification: ${{ steps.filter.outputs.notification }}
      reporting: ${{ steps.filter.outputs.reporting }}
      config: ${{ steps.filter.outputs.config }}
      nginx: ${{ steps.filter.outputs.nginx }}
      whatsapp: ${{ steps.filter.outputs.whatsapp }}
      # Matrice du job `test` (ci-dessous) : un élément par service dont le
      # path-filter est 'true'. Construite ici, PAS via un `if:` de job
      # indexé par `matrix.service` — vérifié avec actionlint que le contexte
      # `matrix` est refusé dans un `if:` de job ("available contexts are
      # github, inputs, needs, vars"), avant même de pousser une seule fois.
      # C'est le job `test` entier qui est sauté (`if: outputs.test_matrix !=
      # '[]'`) quand aucun des 8 services n'a changé, et sinon la matrice ne
      # contient QUE les services concernés — la sélectivité par service est
      # ainsi équivalente à l'ancien `needs.changes.outputs.<svc> == 'true'`
      # par job, sans qu'aucune combinaison inutile ne soit même créée (donc
      # rien à sauter : moins de bruit qu'un SKIPPED par combinaison).
      test_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth/**'
              - 'proto/auth_service.proto'
            gateway:
              - 'gateway/**'
              - 'proto/**'
            abonne:
              - 'services/abonne/**'
              - 'proto/abonne_service.proto'
            campagne:
              - 'services/campagne/**'
              - 'proto/campagne_service.proto'
              - 'proto/abonne_service.proto'
              - 'proto/facturation_service.proto'
            facturation:
              - 'services/facturation/**'
              - 'proto/facturation_service.proto'
              - 'proto/campagne_service.proto'
              - 'proto/config_service.proto'
              - 'proto/paiement_service.proto'
              - 'proto/abonne_service.proto'
            paiement:
              - 'services/paiement/**'
              - 'proto/paiement_service.proto'
              - 'proto/facturation_service.proto'
              - 'proto/abonne_service.proto'
              - 'proto/config_service.proto'
            notification:
              - 'services/notification/**'
              - 'proto/notification_service.proto'
              - 'proto/facturation_service.proto'
              - 'proto/abonne_service.proto'
              - 'proto/config_service.proto'
            reporting:
              - 'services/reporting/**'
              - 'proto/reporting_service.proto'
            config:
              - 'services/config/**'
              - 'proto/config_service.proto'
            nginx:
              - 'nginx/**'
            whatsapp:
              - 'whatsapp-service/**'
      - name: Construit la matrice du job `test` (un élément par service modifié)
        id: matrix
        env:
          FILTER_JSON: ${{ toJSON(steps.filter.outputs) }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os

          # Dossier Django du domaine métier — ne se déduit pas du nom du
          # service (ex. "auth" -> "comptes") : voir les 8 anciens jobs
          # test-<svc> remplacés par cette matrice.
          apps = {
              "auth": "comptes",
              "abonne": "abonnes",
              "campagne": "campagnes",
              "facturation": "factures",
              "paiement": "paiements",
              "notification": "notifications",
              "config": "parametres",
              "reporting": "stats",
          }
          needs_jwt_keys = {"auth"}
          needs_pii_key = {"abonne", "notification"}

          filters = json.loads(os.environ["FILTER_JSON"])
          matrix = [
              {
                  "service": service,
                  "app": app,
                  "needs_jwt_keys": service in needs_jwt_keys,
                  "needs_pii_key": service in needs_pii_key,
              }
              for service, app in apps.items()
              if filters.get(service) == "true"
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
          PYEOF

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tourne toujours, indépendamment du path-filter ci-dessus : une dérive entre
  # la source canonique (libs/sgfe_common/) et une seule des 9 copies ne
  # toucherait qu'un seul dossier services/*, donc pas forcément celui qui a
  # changé dans le commit qui introduit la dérive. Un job gardé par path-filter
  # aurait laissé passer exactement l'incident du 04/09 (deux campagnes mypy
  # ayant chacune corrigé la copie de leurs 3 services sans jamais reporter le
  # correctif vers la source canonique — sync-grpc-lib.sh --check ne tournait
  # nulle part en CI pour l'attraper).
  check-grpc-lib-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Vérifie l'absence de dérive (sync-grpc-lib.sh --check)
        run: ./scripts/sync-grpc-lib.sh --check

  # Même rationale que check-grpc-lib-drift ci-dessus, pour la lib partagée
  # d'isolation Postgres (`SET ROLE` sur un rôle `_runtime` non
  # superutilisateur — voir libs/sgfe_common/sgfe_common/db_hardening.py,
  # AUDIT_SGFE.md §8·J). Tourne toujours, pas de path-filter, pour la même
  # raison : une dérive sur une seule copie (paiement OU facturation, et
  # demain campagne/abonné/auth/config) ne toucherait pas forcément le
  # dossier services/* modifié par le commit qui l'introduit.
  check-db-hardening-lib-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Vérifie l'absence de dérive (sync-db-hardening-lib.sh --check)
        run: ./scripts/sync-db-hardening-lib.sh --check

  # Même rationale que check-grpc-lib-drift/check-db-hardening-lib-drift
  # ci-dessus, pour la lib partagée de chaînage de hash tamper-evident des
  # logs (voir libs/sgfe_common/sgfe_common/log_integrity.py, AUDIT_SGFE.md
  # §J "Journalisation de sécurité centralisée et inviolable"). Tourne
  # toujours, pas de path-filter, pour la même raison que les deux jobs
  # ci-dessus. Le module n'a aucune dépendance Django/tierce (stdlib
  # uniquement) : ses tests tournent ici directement avec le Python du
  # runner, sans venv de service.
  check-log-integrity-lib-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Vérifie l'absence de dérive (sync-log-integrity-lib.sh --check)
        run: ./scripts/sync-log-integrity-lib.sh --check
      - name: Tests unitaires (sgfe_common.log_integrity / verifier_chaine_logs)
        run: python3 -m unittest discover -s libs/sgfe_common/tests -v

  # Scanner de mauvaise configuration des pipelines eux-mêmes (CIS 2.3.6,
  # OWASP CICD-SEC-8) : actionlint (rhysd/actionlint) analyse tous les
  # workflows .github/workflows/*.yml — syntaxe, expressions ${{ }} mal
  # formées, `runs-on` invalide, jobs déclarés dans `needs` qui n'existent
  # pas, incompatibilités de clés (ex. `timeout-minutes` sur un job qui
  # appelle un workflow réutilisable — non détectable par un simple
  # `yaml.safe_load`, qui ne valide que la syntaxe YAML, pas le schéma
  # GitHub Actions). Tourne toujours, indépendamment du path-filter.
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # `github-pr-check` (ci-dessous) poste un Check Run natif — c'est le
      # seul reporter réellement documenté par cette action (`reporter:
      # local` n'existe pas : testé en CI réelle, échoue avec "reviewdog:
      # diff command is empty"). `checks: write` élevé uniquement sur ce
      # job, pas au niveau du workflow.
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: actionlint (rhysd/actionlint via reviewdog)
        uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          fail_level: error
          reporter: github-pr-check
          # `nofilter` : signale tout le fichier, pas seulement les lignes
          # changées.
          filter_mode: nofilter

  # Matrice remplaçant 8 jobs test-<svc> quasi identiques (auth, abonne,
  # campagne, facturation, paiement, notification, config, reporting) —
  # gateway reste un job séparé (test-gateway, ci-dessous) : ni base Postgres,
  # ni working-directory sous services/, sa forme diffère trop pour entrer
  # dans cette matrice sans y ajouter des branches conditionnelles inutiles.
  #
  # Sélectivité par service PRÉSERVÉE À L'IDENTIQUE, mais PAS via un `if:` de
  # job indexé par `matrix.service` comme envisagé initialement : actionlint
  # refuse `needs.changes.outputs[matrix.service]` dans un `if:` de job
  # ("context matrix is not allowed here — available contexts are github,
  # inputs, needs, vars"), erreur confirmée avant tout push — le contexte
  # matrix n'existe qu'une fois la matrice déjà instanciée, donc pas encore
  # disponible au moment où le `if:` du job lui-même est évalué. La matrice
  # est donc construite dynamiquement par le job `changes` (étape
  # "Construit la matrice...", sortie `test_matrix`, un objet JSON par
  # service dont le path-filter est 'true') et injectée ici via
  # `fromJSON(...)` : un push qui ne touche que services/paiement/ crée une
  # matrice à un seul élément — les 7 autres services n'ont AUCUNE
  # combinaison créée pour eux, pas même une combinaison SKIPPED.
  #
  # `app` est le nom du dossier Django du domaine métier (ex. `comptes` pour
  # le service `auth`) — il ne se déduit pas de `service`, d'où la liste
  # `include` construite par le job `changes` plutôt qu'un simple tableau
  # `service: [...]`. Le préfixe des variables d'environnement de connexion
  # Postgres (`AUTH_DB_HOST`, etc.) se déduit lui bien de `service`
  # (identique en majuscules) : calculé en shell (`tr` — GitHub Actions n'a
  # pas de fonction upper() dans ses expressions) plutôt que dupliqué comme
  # champ de matrice.
  #
  # Ordre des étapes unifié : la génération de PII_ENCRYPTION_KEY (abonne,
  # notification) est placée AVANT mypy pour les deux, alors qu'elle suivait
  # pip-audit/bandit sur l'ancien job test-abonne. Nécessaire pour abonne :
  # son mypy importe settings.py, qui exige la clé Fernet déjà en place (même
  # raison que la paire de clés JWT ci-dessous pour auth). Sans effet sur
  # notification, dont le mypy ne dépend pas de cette clé (l'ancien job
  # l'exécutait déjà avant de la générer). pip-audit/bandit passent après
  # mypy pour tous : ce sont des vérifications indépendantes du code déjà
  # présent sur le disque, leur ordre relatif ne change ni le résultat final
  # du job ni les vérifications réellement exécutées en cas de succès.
  test:
    needs: changes
    if: needs.changes.outputs.test_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    # PostgreSQL 16 — même moteur qu'en production (docker-compose.yml utilise
    # postgres:16-alpine) plutôt que le SQLite en mémoire des tests locaux.
    # settings.py bascule sur Postgres quand FORCE_POSTGRES_TESTS est vrai ;
    # par défaut (dev local) il reste sur SQLite pour un cycle rapide. Nom de
    # base/utilisateur : `<service>_db`/`<service>_user` pour les 8 — vérifié
    # ligne à ligne sur les jobs remplacés, aucune exception.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ matrix.service }}_db
          POSTGRES_USER: ${{ matrix.service }}_user
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ matrix.service }}_user -d ${{ matrix.service }}_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORCE_POSTGRES_TESTS: "True"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Variables de connexion Postgres (préfixe = service en MAJUSCULES)
        run: |
          prefix=$(echo "${{ matrix.service }}" | tr '[:lower:]' '[:upper:]')
          {
            echo "${prefix}_DB_HOST=localhost"
            echo "${prefix}_DB_PORT=5432"
            echo "${prefix}_DB_NAME=${{ matrix.service }}_db"
            echo "${prefix}_DB_USER=${{ matrix.service }}_user"
            echo "${prefix}_DB_PASSWORD=ci-postgres-password"
          } >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.15.20 coverage pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Génère une paire de clés JWT RS256 éphémère (mypy importe settings.py hors du mode TESTING de manage.py test, qui génère la sienne en mémoire — sans ce fichier, l'import échoue en CI où keys/ n'existe pas)
        if: matrix.needs_jwt_keys
        run: ../../scripts/gen-jwt-keys.sh keys
      - name: Génère une clé Fernet éphémère (CI uniquement, jamais committée)
        if: matrix.needs_pii_key
        run: echo "PII_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
      - name: Vérification des types (mypy --strict)
        run: mypy --strict --show-traceback ${{ matrix.app }}/
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Analyse statique de sécurité (bandit)
        run: bandit -r . --exclude ./proto,./${{ matrix.app }}/migrations -ll
      - name: Tests + couverture
        run: |
          coverage run --source=${{ matrix.app }} manage.py test ${{ matrix.app }}
          coverage report -m --fail-under=80

  test-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.15.20 coverage pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Vérification des types (mypy --strict)
        run: mypy --strict --show-traceback schema/
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Analyse statique de sécurité (bandit)
        run: bandit -r . --exclude ./proto -ll
      - name: Tests + couverture
        run: |
          coverage run --source=schema manage.py test schema
          coverage report -m --fail-under=80

  docker-build-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: auth-service
      context: services/auth

  docker-build-config:
    needs: changes
    if: needs.changes.outputs.config == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: config-service
      context: services/config

  docker-build-reporting:
    needs: changes
    if: needs.changes.outputs.reporting == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: reporting-service
      context: services/reporting

  docker-build-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: gateway
      context: gateway

  docker-build-abonne:
    needs: changes
    if: needs.changes.outputs.abonne == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: abonne-service
      context: services/abonne

  docker-build-facturation:
    needs: changes
    if: needs.changes.outputs.facturation == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: facturation-service
      context: services/facturation

  docker-build-campagne:
    needs: changes
    if: needs.changes.outputs.campagne == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: campagne-service
      context: services/campagne

  docker-build-paiement:
    needs: changes
    if: needs.changes.outputs.paiement == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: paiement-service
      context: services/paiement

  docker-build-notification:
    needs: changes
    if: needs.changes.outputs.notification == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: notification-service
      context: services/notification

  docker-build-nginx:
    needs: changes
    if: needs.changes.outputs.nginx == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: nginx
      context: nginx

  docker-build-whatsapp:
    needs: changes
    if: needs.changes.outputs.whatsapp == 'true'
    uses: ./.github/workflows/_build-scan.yml
    with:
      service: whatsapp-service
      context: whatsapp-service
  # Job agrégateur : seul check à déclarer "required" dans la protection de
  # branche. Les jobs test/test-gateway sont conditionnels (skip si le
  # service n'a pas changé) — les déclarer "required" individuellement
  # bloquerait indéfiniment toute PR qui ne les déclenche pas.
  ci-status:
    if: always()
    # `test` (matrice) remplace les 8 anciens jobs test-auth/test-abonne/
    # .../test-config — un seul job id, la matrice couvre ses combinaisons
    # en interne (voir le job `test` ci-dessus).
    needs: [secrets-scan, check-grpc-lib-drift, check-db-hardening-lib-drift, check-log-integrity-lib-drift, lint-workflows, test, test-gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `contains(needs.*.result, 'failure')` seul laisse passer un job
      # `cancelled` (ex. un timeout) : constaté en réel côté frontend (même
      # job `ci-status`, PR #167 — un `Playwright E2E` annulé à 20m16s par une
      # installation de navigateurs anormalement lente a quand même laissé
      # `ci-status` conclure au succès). `cancelled` doit bloquer comme
      # `failure`, sinon un job qui expire silencieusement fait passer la
      # protection de branche.
      - name: Vérifie qu'aucun job requis n'a échoué ou n'a été annulé
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Au moins un job a échoué ou a été annulé (timeout ?)."
            exit 1
          fi

  # Publication des images sur GHCR : uniquement sur main/develop (jamais sur
  # les PR/feature branches), une fois les tests/scans passés. Réutilise le
  # cache GHA du job docker-build-* correspondant (même scope), génère un
  # SBOM + attestation de provenance, et signe l'image en keyless via
  # l'identité OIDC de GitHub Actions (cosign, sigstore public good instance).
  publish-auth:
    needs: [changes, test, secrets-scan, docker-build-auth]
    if: needs.changes.outputs.auth == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
      # Requis par le job `provenance` de `_publish-image.yml` (générateur
      # SLSA officiel, item #12 du plan de remédiation) : un job appelé ne
      # peut jamais recevoir plus de permissions que son appelant n'en détient
      # — voir le commentaire du job `provenance` dans `_publish-image.yml`.
      actions: read
    uses: ./.github/workflows/_publish-image.yml
    with:
      service: auth-service
      context: services/auth

  publish-config:
    needs: [changes, test, secrets-scan, docker-build-config]
    if: needs.changes.outputs.config == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      id-token: write
      # Requis par le job `provenance` de `_publish-image.yml` (générateur
      # SLSA officiel, item #12 du plan de remédiation) : un job appelé ne
      # peut jamais recevoir plus de permissions que son appelant n'en détient
