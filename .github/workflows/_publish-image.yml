name: Publier et signer une image multi-architecture

# Construit `linux/amd64` **et** `linux/arm64`, pousse la liste de manifestes sur
# GHCR, et la signe — la liste et chacune de ses images enfants.
#
# ── Pourquoi arm64 ────────────────────────────────────────────────────────────
#
# L'infrastructure Ansible provisionne un `t4g.medium` — Graviton, arm64,
# dimensionné sur des `docker stats` réels. Tant que la CI ne publiait que de
# l'amd64, **aucun conteneur n'aurait démarré sur cette instance**. C'était le
# blocage nommé au point 50 du registre, et la raison pour laquelle
# `group_vars/all.yml` porte un avertissement à côté de `instance_type`.
#
# amd64 reste publié : les développeurs travaillent sur Mac Intel et sur des
# postes x86, et les tests de fumée de `cd-prod.yml` tournent sur un runner amd64.
# Ne publier que de l'arm64 casserait les deux.
#
# ── Image scannée = image publiée (item #1 du plan de remédiation) ───────────
#
# Ce job (`publish-*` dans `ci.yml`) a toujours dépendu de `docker-build-*`
# (`_build-scan.yml`) — même commit, même run, le scan Trivy doit passer avant
# toute publication. Mais les deux jobs RECONSTRUISAIENT chacun leur image
# séparément, avec des scopes de cache distincts (`{service}-amd64`/
# `{service}-arm64` côté scan, `{service}-multi` ici) : rien ne garantissait
# que les couches produites ici soient celles qui avaient été scannées, juste
# le même Dockerfile/contexte au même commit — l'écart nommé par
# `docs/CONFORMITE_CICD.md` (CICD-SEC-9) et non résolu par PR #197.
#
# Le `cache-from` ci-dessous lit maintenant AUSSI les scopes par architecture
# que `docker-build-*` vient de remplir dans CE MÊME run, en plus du scope
# `{service}-multi` de ce job. Le build multi-plateforme retombe donc sur un
# cache-hit total pour chaque architecture — les couches réellement publiées
# sont celles que Trivy a scannées quelques instants plus tôt dans le même
# workflow, pas une reconstruction indépendante. Un `docker/build-push-action`
# en cache-hit ne ré-exécute aucune instruction du Dockerfile ; seul l'emballage
# en liste de manifestes et le push sont nouveaux ici.
#
# Limite honnête : ceci garantit l'identité des couches EN CAS DE cache-hit
# (à confirmer empiriquement au prochain run réel — voir le commentaire de la
# PR). Si le cache GitHub Actions expirait ou était invalidé entre les deux
# jobs (fenêtre de quelques minutes dans la même exécution — cas non observé,
# mais pas mathématiquement impossible), ce build ré-exécuterait le Dockerfile
# sans un nouveau scan avant le push. Fermer ce résidu demanderait de scanner
# l'image multi-plateformes elle-même après publication (bloquant, avec
# rollback) — hors périmètre de ce correctif, noté pour une itération future
# si jamais observé.
#
# ── Signature et provenance SLSA isolées du build (SLSA Build L3) ────────────
#
# Écart trouvé le 07/09/2026 en revérifiant le tableau SLSA de Verdict SGFE :
# la provenance était déjà isolée (voir plus bas), mais la signature cosign
# tournait encore DANS le job `publish`, avec le même jeton OIDC accessible
# pendant tout le job — y compris pendant les étapes de build elles-mêmes.
# SLSA Build L3 refuse précisément ce schéma : une signature qu'un job peut
# se délivrer à lui-même ne prouve rien qu'une étape de build compromise
# n'aurait pu falsifier. Le job `sign` ci-dessous, comme `provenance`, ne
# reçoit que `image`/`digest` — jamais le contexte de build — et obtient son
# propre jeton OIDC, distinct de celui de `publish`.
#
# `job_workflow_ref` (ce dont Fulcio dérive l'identité du certificat) pointe
# sur le FICHIER de workflow qui exécute le job, pas sur le nom du job — ce
# déplacement ne change donc rien à l'identité `_publish-image.yml@…` déjà
# vérifiée par `cd-prod.yml` (job `verifier-signatures`).
#
# Jusqu'ici, `docker/build-push-action` auto-attestait sa propre provenance
# (`provenance: true`) et `cosign` la signait, dans CE MÊME job, avec le même
# jeton OIDC accessible pendant tout le job — y compris pendant les étapes de
# build elles-mêmes. SLSA Build L3 refuse précisément ce schéma : une
# provenance qu'un job peut se délivrer à lui-même ne prouve rien qu'une étape
# de build compromise n'aurait pu falsifier.
#
# Le job `provenance` ci-dessous appelle le générateur officiel
# `slsa-framework/slsa-github-generator` (générateur "container", stable
# depuis sa v1.4.0) : un job séparé, un jeton OIDC séparé, dont TOUTES les
# étapes sont définies par ce projet tiers — rien de ce que ce dépôt écrit
# dans ses propres étapes de build ne peut l'influencer. Il reçoit uniquement
# le digest d'une image DÉJÀ poussée par le job `publish`, jamais le contexte
# de build ni le code source.
#
# ⚠️ `slsa-github-generator` n'est plus activement maintenu depuis 2025 (dernière
# version : v2.1.0, février 2025) ; le projet lui-même recommande désormais les
# « GitHub artifact attestations » natives pour les nouveaux projets. Mais ces
# dernières s'exécutent comme une étape ordinaire DANS le job appelant — donc
# avec le même défaut d'isolation que le `provenance: true` retiré ici — et ne
# répondent donc pas, à ma connaissance à la date de cette migration, à
# l'exigence d'isolation propre à L3. `slsa-github-generator` reste la seule
# option identifiée qui isole réellement la génération dans un job distinct ;
# ses provenances déjà émises restent valides et le générateur continue de
# fonctionner (« stable », pas retiré). À réévaluer si un successeur isolé
# apparaît.

on:
  workflow_call:
    inputs:
      service:
        description: "Nom de l'image, ex. auth-service"
        required: true
        type: string
      context:
        description: "Répertoire de build, ex. services/auth"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # Deux architectures dont une émulée : plus long qu'un build simple, mais
    # très loin des 6 heures par défaut. Le plafond reste un garde-fou de coût.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    # Consommés par les jobs `sign`/`provenance` ci-dessous : le nom d'image (sans tag
    # ni digest) et le digest de la liste de manifestes tout juste poussée.
    # C'est tout ce que ces deux jobs isolés reçoivent de celui-ci — jamais le
    # contexte de build.
    outputs:
      image: ${{ steps.repo.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Mettre le nom du dépôt en minuscules
        # GHCR refuse les majuscules dans un nom d'image, et `GITHUB_REPOSITORY`
        # en contient. `image` est aussi émis en sortie de job (`outputs.image`
        # ci-dessus) pour le job `provenance`, qui a besoin du nom complet de
        # l'image SANS tag ni digest (exigence du générateur).
        id: repo
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          echo "REPO_LC=$repo_lc" >> "$GITHUB_ENV"
          echo "image=ghcr.io/$repo_lc/${{ inputs.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ inputs.context }}
          # Les deux architectures en UN seul build : buildx produit une liste
          # de manifestes, et `docker pull` sur la machine choisit la bonne
          # variante tout seul. Le compose de production n'a rien à savoir.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/${{ inputs.service }}:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LC }}/${{ inputs.service }}:${{ github.sha }}
          # `{service}-multi` : cache propre à ce job, pour les appels où
          # `docker-build-*` n'a pas tourné juste avant (aucun cas connu
          # aujourd'hui, mais ce fichier reste un workflow réutilisable
          # générique). `{service}-amd64`/`{service}-arm64` : les scopes que
          # `docker-build-*` (`_build-scan.yml`) vient de remplir dans CE MÊME
          # run, sur le MÊME commit — voir le commentaire en tête de fichier
          # (« Image scannée = image publiée »). Buildx choisit lui-même, par
          # plateforme cible, la source qui matche ; lister le scope par
          # architecture EN PREMIER lui donne la priorité sur `-multi`.
          cache-from: |
            type=gha,scope=${{ inputs.service }}-amd64
            type=gha,scope=${{ inputs.service }}-arm64
            type=gha,scope=${{ inputs.service }}-multi
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-multi
          sbom: true
          # Provenance retirée d'ici : elle serait auto-attestée par ce job
          # même, exactement ce que SLSA Build L3 refuse. Le job `provenance`
          # ci-dessous, isolé, la génère à partir du digest publié ligne
          # au-dessus (`steps.build.outputs.digest`) une fois ce job terminé.
          provenance: false

  # ── Signature cosign — job séparé, hors de portée du build (SLSA Build L3) ──
  #
  # Voir le commentaire en tête de fichier. Anciennement la fin du job
  # `publish` : mêmes étapes, déplacées telles quelles, avec leur propre
  # jeton OIDC (`id-token: write` retiré de `publish`, posé ici seulement).
  sign:
    name: Signer l'image (keyless, OIDC GitHub, job isolé)
    needs: publish
    runs-on: ubuntu-latest
    # Seul job réel de ce fichier sans plafond (audit §11.4/§11.9 point 1) :
    # `publish` en a un (45 min), `provenance` appelle un workflow réutilisable
    # externe qui porte le sien. Une commande `cosign sign` qui pend ne doit
    # pas immobiliser le runner 6 heures.
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Signer l'image et ses variantes (keyless, OIDC GitHub)
        # `--recursive` n'est pas décoratif.
        #
        # `needs.publish.outputs.digest` est celui de la LISTE de manifestes.
        # Sans ce drapeau, cosign ne signe que la liste — et la vérification de
        # `cd-prod.yml` porterait sur un index, pas sur l'image arm64 réellement
        # tirée et exécutée sur la machine.
        #
        # C'est le genre de trou qui ne se voit pas : la vérification passe, et
        # ne prouve rien de ce qui tourne.
        run: cosign sign --recursive --yes "${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}"

  # ── Provenance SLSA — job séparé, hors de portée du build (SLSA Build L3) ──
  #
  # Voir le commentaire en tête de fichier. Ce job n'a AUCUNE étape définie
  # par ce dépôt : `uses:` délègue entièrement l'exécution au générateur
  # officiel, dans SON dépôt, à SA version épinglée. Il ne fait ni checkout,
  # ni build — il reçoit uniquement `image`/`digest` en entrée et pousse
  # lui-même l'attestation vers GHCR avec ses propres identifiants.
  provenance:
    name: Générer la provenance SLSA (générateur officiel, job isolé)
    needs: publish
    # Permissions du job qui APPELLE le générateur — documentées par le
    # générateur lui-même (internal/builders/container/README.md) :
    #   - actions: read   → détection de l'environnement GitHub Actions
    #   - id-token: write → jeton OIDC pour la signature keyless (Fulcio)
    #   - packages: write → envoi de l'attestation vers GHCR
    # Aucune permission n'est élevée au niveau du workflow entier : ce bloc
    # ne s'applique qu'à ce job, comme partout ailleurs dans ce dépôt. En
    # contrepartie, les jobs `publish-*` de `ci.yml` qui appellent CE fichier
    # doivent désormais accorder `actions: read` en plus de l'existant — un
    # job appelé ne peut jamais recevoir plus que ce que son appelant détient.
    permissions:
      actions: read
      id-token: write
      packages: write
    # ⚠️ Doit être un tag complet `vX.Y.Z` — le générateur échoue avec un tag
    # court (`@v2`) ou un SHA, contrainte documentée explicitement par le
    # projet (internal/builders/container/README.md). Dérogation délibérée à
    # la convention d'épinglage au SHA de ce dépôt : imposée par la conception
    # du générateur (framework BYOB), pas un oubli.
    #
    # Si cette version change, mettre AUSSI à jour le motif
    # `--certificate-identity-regexp` dans `cd-prod.yml` (job
    # `verifier-signatures`) : l'identité OIDC signée porte ce numéro de
    # version, pas seulement le nom du fichier.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
      registry-username: ${{ github.actor }}
      # Ce dépôt est privé (voir le commentaire sur les runners arm64
      # ci-dessus). Par défaut, le générateur refuse de tourner sur un dépôt
      # privé — la publication d'une entrée dans le journal de transparence
      # PUBLIC Rekor (rekor.sigstore.dev) révélerait le nom du dépôt, et il
      # préfère échouer plutôt que de le faire silencieusement. `cosign sign`
      # ci-dessus le fait déjà (signature keyless via l'instance publique
      # Sigstore, voir le commentaire de `ci.yml` sur les jobs `publish-*`) :
      # ce dépôt a donc déjà accepté cette fuite du nom de dépôt pour la
      # signature d'image. Ce drapeau aligne la provenance sur le même choix
      # déjà fait, plutôt que d'en faire un nouveau sans le dire.
      private-repository: true
    secrets:
      # Le jeton du job, pas un secret dédié — mêmes identifiants que
      # `docker/login-action` ci-dessus (`packages: write` suffit pour GHCR).
      registry-password: ${{ secrets.GITHUB_TOKEN }}
