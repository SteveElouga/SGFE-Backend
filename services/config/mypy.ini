[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main
# Migrations : générées par `makemigrations`, jamais éditées à la main —
# même statut que les stubs *_pb2.py, exclues pour la même raison.
# proto/ : stubs gRPC générés par grpc_tools.protoc (voir les *_pb2.py listés
# plus bas, dont l'import est ignoré) — exclu par cohérence, rien à typer.
exclude = (^|/)(migrations/|proto/)

[mypy.plugins.django-stubs]
django_settings_module = config.settings

[mypy-grpc.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-environ]
ignore_missing_imports = True

[mypy-abonne_service_pb2]
ignore_missing_imports = True

