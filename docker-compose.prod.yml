# docker-compose.prod.yml — surcouche de PRODUCTION. À superposer au compose de
# base :
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# ⚠️ `--no-build` n'est pas décoratif. Le compose de base porte des `build:`, et
# Compose construit localement quand l'image nommée est absente. Sans ce drapeau,
# un `IMAGE_TAG` erroné ne provoquerait pas d'échec : il déclencherait une
# reconstruction silencieuse — c'est-à-dire exactement le défaut qu'on ferme ici.
#
# Rôle de ce fichier, dans l'ordre d'importance :
#
#   1. TIRER au lieu de CONSTRUIRE. Chaque service pointe sur l'image que la CI
#      a publiée, scannée par Trivy, signée par cosign, accompagnée de son SBOM
#      et de sa provenance. Avant, la production recompilait sur place : ces
#      images signées n'étaient jamais exécutées nulle part, et toute la chaîne
#      de confiance ne servait à rien.
#
#   2. Durcissement runtime — redémarrage automatique, limites mémoire,
#      DEBUG=False sur les services Django.
#
# Deux variables sont OBLIGATOIRES, dans `/opt/sgfe/.env` sur la machine :
#
#   GHCR_REPO=steveelouga/sgfe-backend      # le dépôt, en minuscules
#   IMAGE_TAG=a3f9c2e                       # le SHA de commit à exécuter
#
# La syntaxe `${VAR:?message}` fait échouer le déploiement si l'une manque,
# plutôt que d'interpoler une chaîne vide et de tirer `service:` — une référence
# qui résoudrait vers `latest`, c'est-à-dire n'importe quoi.
#
# **Déployer** = réécrire `IMAGE_TAG`, tirer, relancer.
# **Revenir en arrière** = réécrire l'ancien tag. Aucune reconstruction dans les
# deux sens, et le retour arrière est aussi rapide que l'aller.
#
# ⚠️ SECRETS : le docker-compose.yml de base contient des valeurs DEV EN DUR
# (`devpassword`, `django-insecure-placeholder`, placeholders de clés). Elles NE
# conviennent PAS en production : voir `docs/INFRASTRUCTURE_AWS.md` et l'inventaire
# des 43 affectations de secret (artefact « Six Secrets »).

x-prod: &prod
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 768M

services:
  # --- Infra & bases : redémarrage + limite mémoire ---
  redis:
    <<: *prod
  auth-postgres:
    <<: *prod
  abonne-postgres:
    <<: *prod
  campagne-postgres:
    <<: *prod
  facturation-postgres:
    <<: *prod
  paiement-postgres:
    <<: *prod
  notification-postgres:
    <<: *prod
  config-postgres:
    <<: *prod
  reporting-postgres:
    <<: *prod
  nginx:
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/nginx:${IMAGE_TAG:?IMAGE_TAG manquant}
    <<: *prod
    ports:
      - "443:443"
    volumes:
      # Certificats Let's Encrypt sur la machine hôte, renouvelés par
      # certbot (voir scripts/renew-letsencrypt-cert.sh) — certbot y nomme
      # déjà ses fichiers fullchain.pem/privkey.pem : même chemin logique
      # qu'en dev (nginx/certs), default.conf ne distingue pas les deux.
      - ${LETSENCRYPT_CERT_DIR:?LETSENCRYPT_CERT_DIR manquant — nginx ne trouverait aucun certificat TLS}:/etc/nginx/certs:ro
      - ${CERTBOT_WEBROOT_DIR:-/var/www/sgfe-certbot}:/var/www/certbot:ro
  db-backup:
    <<: *prod

  # --- WhatsApp : Chromium (puppeteer) → plus de mémoire ---
  whatsapp-service:
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/whatsapp-service:${IMAGE_TAG:?IMAGE_TAG manquant}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M

  # --- Services Django : durcissement, DEBUG=False, et PAS de migration ---
  #
  # Le compose de base lance `migrate && grpc_server`. C'est commode en
  # développement — on ne pense pas aux migrations — et dangereux en production :
  # combiné au `restart: unless-stopped` ci-dessus, une migration fautive fait
  # **boucler le conteneur indéfiniment**. Il sort, redémarre, remigre, échoue,
  # recommence. Rien n'arrête la boucle, et le service paraît « en train de
  # démarrer » pendant qu'il ne démarrera jamais.
  #
  # En production, les migrations sont une **étape gatée du déploiement**, jouée
  # service par service avec arrêt au premier échec — voir `cd-prod.yml`. Un
  # échec y est visible, nommé, et n'a pas encore remplacé les conteneurs en
  # service.
  #
  # La surcouche remplace donc la commande pour ne garder que le serveur gRPC.
  # (La gateway n'est pas concernée : elle n'a pas de base, donc pas de
  # migration, et utilise le CMD de son image.)
  auth-service:
    command: python manage.py grpc_server
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/auth-service:${IMAGE_TAG:?IMAGE_TAG manquant}
    <<: *prod
    environment:
      DJANGO_DEBUG: "False"
      # Le lien d'activation de compte et celui de réinitialisation de mot de
      # passe partent par e-mail avec cette base. En développement, le compose
      # de base pose `http://localhost:4200` — juste pour un poste de développeur,
      # faux pour tout le reste. Sans ce garde-fou, la valeur de développement
      # s'hériterait en silence et les liens envoyés seraient inouvrables.
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL manquant — les liens d'activation et l'espace abonné partiraient sur localhost}
  abonne-service:
    command: python manage.py grpc_server
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/abonne-service:${IMAGE_TAG:?IMAGE_TAG manquant}
    <<: *prod
    environment:
      DJANGO_DEBUG: "False"
  campagne-service:
    command: python manage.py grpc_server
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/campagne-service:${IMAGE_TAG:?IMAGE_TAG manquant}
    <<: *prod
    environment:
      DJANGO_DEBUG: "False"
  facturation-service:
    command: python manage.py grpc_server
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/facturation-service:${IMAGE_TAG:?IMAGE_TAG manquant}
    <<: *prod
    environment:
      DJANGO_DEBUG: "False"
  paiement-service:
    command: python manage.py grpc_server
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/paiement-service:${IMAGE_TAG:?IMAGE_TAG manquant}
    <<: *prod
    environment:
      DJANGO_DEBUG: "False"
  notification-service:
    command: python manage.py grpc_server
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/notification-service:${IMAGE_TAG:?IMAGE_TAG manquant}
    <<: *prod
    environment:
      DJANGO_DEBUG: "False"
      # C'est ICI que ça compte le plus : `notifications/grpc_server.py` et
      # `services.py` construisent le lien de l'espace abonné en
      # `{FRONTEND_URL}/espace/{token}`, et ce lien part par WhatsApp sur le
      # téléphone de l'abonné. Avec la valeur de développement, chaque message
      # envoyé porte un lien vers `localhost` — inouvrable, et l'abonné n'a aucun
      # moyen de savoir que c'est nous qui nous sommes trompés.
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL manquant — le lien de l'espace abonné partirait sur localhost dans chaque WhatsApp}
  config-service:
    command: python manage.py grpc_server
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/config-service:${IMAGE_TAG:?IMAGE_TAG manquant}
    <<: *prod
    environment:
      DJANGO_DEBUG: "False"
  reporting-service:
    command: python manage.py grpc_server
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/reporting-service:${IMAGE_TAG:?IMAGE_TAG manquant}
    <<: *prod
    environment:
      DJANGO_DEBUG: "False"
  gateway:
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO manquant}/gateway:${IMAGE_TAG:?IMAGE_TAG manquant}
    <<: *prod
    environment:
      DJANGO_DEBUG: "False"
