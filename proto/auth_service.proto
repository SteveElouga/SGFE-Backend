syntax = "proto3";
package auth;

service AuthService {
  // identifier accepte un username ou un numéro de téléphone (+237XXXXXXXXX)
  rpc Login (LoginRequest) returns (TokenResponse);
  rpc ValidateToken (TokenRequest) returns (UserPayload);
  rpc RefreshToken (RefreshRequest) returns (TokenResponse);
  rpc Logout (TokenRequest) returns (StatusResponse);
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc DeactivateUser (DeactivateUserRequest) returns (UserResponse);
  rpc ReactivateUser (UserIdRequest) returns (UserResponse);
  rpc ListUsers (EmptyRequest) returns (ListUsersResponse);
  rpc GetUser (UserIdRequest) returns (UserResponse);
  // Reset mot de passe ADMIN uniquement (lien e-mail)
  rpc RequestPasswordReset (EmailRequest) returns (StatusResponse);
  rpc SetPasswordWithToken (SetPasswordRequest) returns (StatusResponse);
  // Renvoi manuel (déclenché par un admin) des identifiants d'accès à un
  // utilisateur donné : lien d'activation si le compte est encore en attente,
  // sinon lien/OTP de réinitialisation — selon le rôle et l'état du compte.
  rpc ResetUserPassword (UserIdRequest) returns (UserResponse);
  // Activation et reset par OTP WhatsApp (tous les rôles)
  rpc RequestPhoneOtp (PhoneRequest) returns (StatusResponse);
  rpc VerifyOtpAndSetPassword (VerifyOtpRequest) returns (StatusResponse);
  // RGPD — droit à l'effacement. N'anonymise QUE l'identité nominative
  // (username, e-mail, téléphone) d'un utilisateur interne ; refuse si le
  // compte est encore actif (is_active=true). Ne touche jamais à l'AuditLog
  // (chantier séparé, feat/piste-audit-auth) ni au rôle. Idempotent :
  // ré-appeler sur un utilisateur déjà anonymisé réapplique les mêmes
  // valeurs sans erreur.
  rpc AnonymiserUtilisateur (UserIdRequest) returns (UserResponse);
  // RGPD — droit à la portabilité. Export JSON structuré des données
  // personnelles d'un utilisateur interne (identité, cycle de vie du
  // compte, historique de connexion si trackable). Dégradation gracieuse
  // par section : voir comptes/export.py.
  rpc ExporterDonneesUtilisateur (UserIdRequest) returns (ExportDonneesUtilisateurResponse);
  // Centralise un événement de sécurité poussé par un composant tiers (la
  // gateway aujourd'hui : refus de rôle `require_role`, échec de validation
  // de jeton `require_auth`) dans l'AuditLog de ce service — voir
  // AUDIT_SGFE.md §J, "Journalisation de sécurité centralisée et
  // inviolable". Écriture seule, sans mutation métier associée. Appelé en
  // BEST-EFFORT par l'appelant : un échec de ce RPC (ce service indisponible,
  // par exemple) ne doit jamais faire échouer la requête qui a déclenché
  // l'événement de sécurité d'origine — le logger local dédié reste alors le
  // seul filet (voir gateway/schema/context.py).
  rpc EnregistrerEvenementSecurite (EnregistrerEvenementSecuriteRequest) returns (StatusResponse);
}

message LoginRequest {
  // Accepte un nom d'utilisateur ou un numéro de téléphone camerounais (+237XXXXXXXXX)
  string identifier = 1;
  string password = 2;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message TokenRequest {
  string token = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message UserPayload {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  bool is_active = 5;
  string phone_number = 6;
}

message CreateUserRequest {
  string username = 1;
  // Obligatoire pour ADMIN, ignoré pour les autres rôles
  string email = 2;
  string role = 3;
  // Obligatoire pour tous les rôles
  string phone_number = 4;
}

message EmailRequest {
  string email = 1;
}

message PhoneRequest {
  string phone_number = 1;
}

message SetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message VerifyOtpRequest {
  string phone_number = 1;
  string otp_code = 2;
  string new_password = 3;
}

message UpdateUserRequest {
  string user_id = 1;
  string email = 2;
  string role = 3;
  string phone_number = 4;
}

message UserIdRequest {
  string user_id = 1;
}

message DeactivateUserRequest {
  string user_id = 1;
  // Identité de l'appelant (résolue depuis son JWT côté Gateway) : sert à
  // interdire l'auto-désactivation d'un admin.
  string caller_id = 2;
}

message UserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  bool is_active = 5;
  string created_at = 6;
  string phone_number = 7;
}

message ListUsersResponse {
  repeated UserResponse users = 1;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
}

message EmptyRequest {}

// Export RGPD synchrone : les données d'un utilisateur interne (identité,
// cycle de vie du compte, historique de connexion) restent d'un volume
// négligeable — pas besoin d'un mécanisme de référence/job asynchrone
// (même choix que ExportDonneesAbonneResponse, proto/abonne_service.proto).
message ExportDonneesUtilisateurResponse {
  // JSON structuré (UTF-8) — voir comptes/export.py::ExportService pour le
  // schéma exact des sections.
  string json_export = 1;
}

message EnregistrerEvenementSecuriteRequest {
  // Ex. "ROLE_REFUSE", "TOKEN_INVALIDE" — voir gateway/schema/context.py
  // pour la liste des valeurs émises aujourd'hui.
  string type_evenement = 1;
  // Détail lisible par un humain (rôle requis/obtenu, message d'erreur...).
  string detail = 2;
  // Identité de l'acteur si elle est connue au moment de l'événement — vide
  // pour un jeton invalide (aucune identité n'a pu être résolue).
  string acteur_id = 3;
  string acteur_nom = 4;
  string acteur_role = 5;
  // Identifiant de corrélation de la requête gateway d'origine (voir
  // schema/identity_context.py::get_request_id).
  string request_id = 6;
}
