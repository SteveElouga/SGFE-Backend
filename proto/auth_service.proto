syntax = "proto3";
package auth;

service AuthService {
  // identifier accepte un username ou un numéro de téléphone (+237XXXXXXXXX)
  rpc Login (LoginRequest) returns (TokenResponse);
  rpc ValidateToken (TokenRequest) returns (UserPayload);
  rpc RefreshToken (RefreshRequest) returns (TokenResponse);
  rpc Logout (TokenRequest) returns (StatusResponse);
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc DeactivateUser (DeactivateUserRequest) returns (UserResponse);
  rpc ReactivateUser (UserIdRequest) returns (UserResponse);
  rpc ListUsers (EmptyRequest) returns (ListUsersResponse);
  rpc GetUser (UserIdRequest) returns (UserResponse);
  // Reset mot de passe ADMIN uniquement (lien e-mail)
  rpc RequestPasswordReset (EmailRequest) returns (StatusResponse);
  rpc SetPasswordWithToken (SetPasswordRequest) returns (StatusResponse);
  // Renvoi manuel (déclenché par un admin) des identifiants d'accès à un
  // utilisateur donné : lien d'activation si le compte est encore en attente,
  // sinon lien/OTP de réinitialisation — selon le rôle et l'état du compte.
  rpc ResetUserPassword (UserIdRequest) returns (UserResponse);
  // Activation et reset par OTP WhatsApp (tous les rôles)
  rpc RequestPhoneOtp (PhoneRequest) returns (StatusResponse);
  rpc VerifyOtpAndSetPassword (VerifyOtpRequest) returns (StatusResponse);
}

message LoginRequest {
  // Accepte un nom d'utilisateur ou un numéro de téléphone camerounais (+237XXXXXXXXX)
  string identifier = 1;
  string password = 2;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message TokenRequest {
  string token = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message UserPayload {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  bool is_active = 5;
  string phone_number = 6;
}

message CreateUserRequest {
  string username = 1;
  // Obligatoire pour ADMIN, ignoré pour les autres rôles
  string email = 2;
  string role = 3;
  // Obligatoire pour tous les rôles
  string phone_number = 4;
}

message EmailRequest {
  string email = 1;
}

message PhoneRequest {
  string phone_number = 1;
}

message SetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message VerifyOtpRequest {
  string phone_number = 1;
  string otp_code = 2;
  string new_password = 3;
}

message UpdateUserRequest {
  string user_id = 1;
  string email = 2;
  string role = 3;
  string phone_number = 4;
}

message UserIdRequest {
  string user_id = 1;
}

message DeactivateUserRequest {
  string user_id = 1;
  // Identité de l'appelant (résolue depuis son JWT côté Gateway) : sert à
  // interdire l'auto-désactivation d'un admin.
  string caller_id = 2;
}

message UserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  bool is_active = 5;
  string created_at = 6;
  string phone_number = 7;
}

message ListUsersResponse {
  repeated UserResponse users = 1;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
}

message EmptyRequest {}
