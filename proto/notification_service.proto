syntax = "proto3";
package notification;

service NotificationService {
  rpc EnvoyerFacture (EnvoyerFactureRequest) returns (EnvoiResponse);
  rpc ReenvoyerFacture (FactureIdRequest) returns (EnvoiResponse);
  // Confirmation de paiement : envoie le reçu (PDF) à l'abonné après un versement.
  rpc EnvoyerRecu (EnvoyerRecuRequest) returns (EnvoiResponse);
  rpc EnvoyerRelance (EnvoyerRelanceRequest) returns (EnvoiResponse);
  rpc GetEnvoi (EnvoiIdRequest) returns (EnvoiResponse);
  rpc ListEnvois (ListEnvoisRequest) returns (ListEnvoisResponse);
  rpc ValiderToken (ValiderTokenRequest) returns (ValiderTokenResponse);
  rpc RevoquerToken (TokenIdRequest) returns (StatusResponse);
  rpc RevoquerTousTokens (EmptyRequest) returns (RevoquerTousTokensResponse);
  rpc GetEspaceUrl (GetEspaceUrlRequest) returns (EspaceUrlResponse);
  rpc NotifierAdmins (NotifierAdminsRequest) returns (StatusResponse);
  rpc GetWhatsAppQr (EmptyRequest) returns (WhatsAppQrResponse);
  rpc TesterEnvoi (TesterEnvoiRequest) returns (StatusResponse);
}

message EnvoyerFactureRequest {
  string facture_id = 1;
  string abonne_id = 2;
}

message EnvoyerRecuRequest {
  string paiement_id = 1;
  string facture_id = 2;
  string abonne_id = 3;
  double montant = 4;
  double solde_restant = 5;
}

message EnvoyerRelanceRequest {
  string facture_id = 1;
  string abonne_id = 2;
  int32 etape = 3;
}

message FactureIdRequest { string facture_id = 1; }
message EnvoiIdRequest { string envoi_id = 1; }
message TokenIdRequest { string token_id = 1; }

message ListEnvoisRequest {
  string facture_id = 1;
  string abonne_id = 2;
}

message ValiderTokenRequest { string token = 1; }

message NotifierAdminsRequest {
  string evenement = 1;
  string detail = 2;
  string entite_id = 3;
}

message EnvoiResponse {
  string envoi_id = 1;
  string facture_id = 2;
  string statut = 3;
  string date_envoi = 4;
  string telnyx_message_id = 5;  // legacy — exposé en GraphQL sous message_id
  string erreur = 6;             // exposé en GraphQL sous raison_echec
  string type_envoi = 7;         // FACTURE | RELANCE_1..4 | AVERTISSEMENT | SUSPENSION | RETABLISSEMENT
  string abonne_id = 8;
}

message ValiderTokenResponse {
  bool is_valid = 1;
  string abonne_id = 2;
  string date_expiration = 3;
}

// Récupère (ou crée) l'URL de l'espace abonné pour un abonné donné.
// Utilisé par Facturation pour afficher le lien de consultation sur le PDF.
// `facture_id` sert uniquement à créer un token s'il n'en existe pas encore
// de valide pour l'abonné (un token existant valide est réutilisé).
message GetEspaceUrlRequest {
  string abonne_id = 1;
  string facture_id = 2;
}

message EspaceUrlResponse {
  string url = 1;             // {FRONTEND_URL}/espace/{token}
  string date_expiration = 2; // ISO YYYY-MM-DD
}

message ListEnvoisResponse { repeated EnvoiResponse envois = 1; }

message StatusResponse {
  bool success = 1;
  string message = 2;
}

message EmptyRequest {}

// Statut de connexion WhatsApp + QR code de liaison (destiné à l'UI admin).
// qr : data-URL PNG à afficher (<img src>), vide si ready=true ou en cours d'init.
// number : numéro du compte WhatsApp appairé, présent uniquement si ready=true.
message WhatsAppQrResponse {
  bool ready = 1;
  string qr = 2;
  string number = 3;
  // « connecte » | « qr » | « demarrage » | « rupture ».
  // Un booléen ne distinguait pas « ça démarre, patientez » de « la liaison est
  // tombée, il faut rescanner » — deux situations qui appellent des messages
  // opposés, et que l'écran affichait de la même façon.
  string phase = 4;
  // Millisecondes écoulées depuis la dernière connexion réussie (0 si jamais).
  int64 depuis_ms = 5;
}

message RevoquerTousTokensResponse {
  // Nombre de tokens actifs qui ont été révoqués.
  int32 count = 1;
}

message TesterEnvoiRequest {
  string phone_number = 1;
}
