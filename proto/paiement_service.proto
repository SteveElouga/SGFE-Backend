syntax = "proto3";
package paiement;

service PaiementService {
  rpc InitialiserSolde (InitialiserSoldeRequest) returns (SoldeResponse);
  rpc EnregistrerPaiement (EnregistrerPaiementRequest) returns (PaiementResponse);
  // Annule un paiement enregistré par erreur (rétablit le solde) — avec traçabilité.
  rpc AnnulerPaiement (AnnulerPaiementRequest) returns (PaiementResponse);
  rpc GetSolde (FactureIdRequest) returns (SoldeResponse);
  rpc ListPaiements (ListPaiementsRequest) returns (ListPaiementsResponse);
  // Liste les paiements de toutes les factures d'une campagne (export CSV
  // back-office, écran 13). Le rattachement passe par SoldeFacture.campagne_id.
  rpc ListPaiementsParCampagne (CampagneIdRequest) returns (ListPaiementsResponse);
  rpc ListImpayes (EmptyRequest) returns (ListImpayesResponse);
  rpc GetSuiviImpaye (FactureIdRequest) returns (SuiviImpayeResponse);
  // Ce qu'un abonné doit encore, toutes factures confondues. `hors_facture_id`
  // sert à l'impression : sur une facture, le « solde antérieur » est ce qu'il
  // doit EN PLUS de celle qu'il tient en main.
  rpc GetDetteAbonne (DetteAbonneRequest) returns (DetteAbonneResponse);
  // Encaisse un versement au nom d'un abonné, imputé du plus ancien au plus
  // récent. Produit potentiellement plusieurs écritures.
  rpc EnregistrerPaiementAbonne (EnregistrerPaiementAbonneRequest) returns (PaiementAbonneResponse);
  // Avoir (crédit) de l'abonné : émission d'un avoir manuel (rectification) et
  // consultation du solde + journal des mouvements.
  rpc CrediterAvoir (CrediterAvoirRequest) returns (AvoirResponse);
  rpc GetAvoirAbonne (AbonneIdRequest) returns (AvoirResponse);
  // Éteint le solde d'une facture annulée. Ce que l'abonné avait versé est
  // porté à son avoir : la facture disparaît, pas son argent.
  rpc AnnulerSolde (AnnulerSoldeRequest) returns (AnnulerSoldeResponse);
}

message InitialiserSoldeRequest {
  string facture_id = 1;
  string abonne_id = 2;
  double montant_total = 3;
  string date_limite_paiement = 4;
  // Campagne d'origine de la facture — conservée sur le solde pour agréger les
  // stats de paiement par campagne (Reporting Service, ADR-019).
  string campagne_id = 5;
}

message EnregistrerPaiementRequest {
  string facture_id = 1;
  string abonne_id = 2;
  double montant = 3;
  string date_paiement = 4;
  string mode_paiement = 5;
  string reference_transaction = 6;
  string enregistre_par = 7;
}

message AnnulerPaiementRequest {
  string paiement_id = 1;
  string motif = 2;
  string annule_par = 3;
}

message FactureIdRequest { string facture_id = 1; }
message CampagneIdRequest { string campagne_id = 1; }

message ListPaiementsRequest {
  string facture_id = 1;
  string abonne_id = 2;
  // Bornes de PÉRIODE (ISO `AAAA-MM-JJ`, incluses), sur `date_paiement`.
  // Vides = pas de borne.
  //
  // C'est ce qu'un journal de caisse demande : ce qui est entré entre deux
  // dates. `ListPaiementsParCampagne` ne peut pas y répondre — et manque en
  // outre tout paiement de régularisation, dont le `SoldeFacture` porte un
  // `campagne_id` vide.
  string date_debut = 3;
  string date_fin = 4;
  // Pagination optionnelle, appliquée APRÈS les filtres ci-dessus. Omise
  // (`optional`, pas une valeur zéro), la liste complète filtrée est rendue
  // à l'identique — comportement historique préservé.
  optional int32 limit = 5;
  optional int32 offset = 6;
}

message PaiementResponse {
  string paiement_id = 1;
  string facture_id = 2;
  double montant = 3;
  string date_paiement = 4;
  string mode_paiement = 5;
  string reference_transaction = 6;
  string created_at = 7;
  // ID utilisateur Auth Service ayant enregistré le paiement (résolu en nom
  // d'utilisateur affichable côté Gateway — voir schema/paiement_types.py).
  string enregistre_par = 8;
  string abonne_id = 9;
  // Annulation (traçabilité) : annule=true si le paiement a été annulé.
  bool annule = 10;
  string annule_le = 11;
  string annule_par = 12;
  string motif_annulation = 13;
}

message DetteAbonneRequest {
  string abonne_id = 1;
  string hors_facture_id = 2;
}

message DetteAbonneResponse {
  double total_du = 1;
  int32 nb_factures = 2;
  // Date limite la plus ancienne parmi les factures dues — c'est l'âge qui
  // fait payer, pas le montant.
  string plus_ancienne_echeance = 3;
}

message EnregistrerPaiementAbonneRequest {
  string abonne_id = 1;
  double montant = 2;
  string date_paiement = 3;
  string mode_paiement = 4;
  string reference_transaction = 5;
  string enregistre_par = 6;
}

message PaiementAbonneResponse {
  repeated PaiementResponse paiements = 1;
  double excedent_en_avoir = 2;
}

message SoldeResponse {
  string facture_id = 1;
  double montant_total = 2;
  double montant_paye = 3;
  double solde_restant = 4;
  string statut = 5;
  // Ajoutés en 6 et 7 : l'abonné, pour regrouper les impayés par personne
  // plutôt que par facture ; l'échéance, parce que c'est elle qui ordonne
  // l'imputation et qui porte l'âge de la dette.
  string abonne_id = 6;
  string date_limite_paiement = 7;
  // Part de `montant_paye` provenant d'un avoir et non d'un versement.
  // Sans elle, un abonné dont la facture est réduite par un trop-perçu antérieur
  // lit un « déjà réglé » qu'il ne se souvient pas d'avoir payé.
  double avoir_impute = 8;
}

message SuiviImpayeResponse {
  string suivi_id = 1;
  string facture_id = 2;
  string abonne_id = 3;
  string date_depassement = 4;
  int32 etape_actuelle = 5;
  string resolu_le = 6;
}

message ListPaiementsResponse {
  repeated PaiementResponse paiements = 1;
  // Nombre total de paiements correspondant au filtre, indépendamment de la
  // pagination — permet à un pager de calculer le nombre de pages sans tout
  // charger. Sur les endpoints non paginés qui réutilisent ce message
  // (`ListPaiementsParCampagne`), vaut simplement le nombre d'éléments rendus.
  int32 total = 2;
}
message ListImpayesResponse { repeated SoldeResponse impayes = 1; }

message AbonneIdRequest { string abonne_id = 1; }

message CrediterAvoirRequest {
  string abonne_id = 1;
  double montant = 2;
  string motif = 3;
  string cree_par = 4;
}

message MouvementAvoir {
  double montant = 1;
  string type_mouvement = 2;  // TROP_PERCU | RECTIFICATION | IMPUTATION
  string motif = 3;
  string facture_id = 4;
  string cree_par = 5;
  string created_at = 6;
}

message AvoirResponse {
  string abonne_id = 1;
  double montant = 2;                    // solde d'avoir disponible
  repeated MouvementAvoir mouvements = 3;
}

message EmptyRequest {}

message AnnulerSoldeRequest {
  string facture_id = 1;
  // Obligatoire : c'est la seule trace de la raison, puisqu'aucun index ne
  // justifie la disparition d'une dette.
  string motif = 2;
}

message AnnulerSoldeResponse {
  // Solde éteint (statut ANNULEE, reste à payer nul).
  SoldeResponse solde = 1;
  // Montant reversé à l'avoir de l'abonné (0 si rien n'avait été payé).
  double montant_porte_en_avoir = 2;
}
