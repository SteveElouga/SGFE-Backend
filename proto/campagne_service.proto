syntax = "proto3";
package campagne;

service CampagneService {
  rpc CreateCampagne (CreateCampagneRequest) returns (CampagneResponse);
  rpc GetCampagne (CampagneIdRequest) returns (CampagneResponse);
  rpc ListCampagnes (ListCampagnesRequest) returns (ListCampagnesResponse);
  rpc AssignerAgent (AssignerAgentRequest) returns (CampagneResponse);
  // Affecte un agent à un ensemble de zones (quartier + camp) de la campagne.
  rpc AffecterZones (AffecterZonesRequest) returns (ListAgentsCampagneResponse);
  // Liste les agents affectés à une campagne (global et/ou par zone) + stats.
  rpc ListAgentsCampagne (CampagneIdRequest) returns (ListAgentsCampagneResponse);
  // Rattache des abonnés à une campagne : pré-crée un relevé A_RELEVER pour
  // chacun (sélection des abonnés à relever). Idempotent (déjà inscrit → ignoré).
  rpc AjouterAbonnesCampagne (AjouterAbonnesCampagneRequest) returns (AjouterAbonnesResponse);
  rpc SaisirIndex (SaisirIndexRequest) returns (ReleveResponse);
  rpc CorrigerReleve (CorrigerReleveRequest) returns (ReleveResponse);
  rpc MarquerNonReleve (MarquerNonReleveRequest) returns (ReleveResponse);
  rpc GetReleve (ReleveIdRequest) returns (ReleveResponse);
  rpc ListReleves (CampagneIdRequest) returns (ListRelevesResponse);
  // Tournée d'un agent : ses relevés saisis + les abonnés à relever de son
  // périmètre (ses zones ; ou toute la campagne s'il n'a aucune zone affectée).
  rpc ListRelevesTournee (ListRelevesTourneeRequest) returns (ListRelevesResponse);
  rpc GetProgression (CampagneIdRequest) returns (ProgressionResponse);
  rpc GetResumeCloture (CampagneIdRequest) returns (ResumeClotureResponse);
  // Démarre une campagne PLANIFIEE (→ EN_COURS) sans attendre le cron 7h.
  rpc DemarrerCampagne (CampagneIdRequest) returns (CampagneResponse);
  rpc CloturerCampagne (CampagneIdRequest) returns (CampagneResponse);
  rpc GetDernierIndex (AbonneIdRequest) returns (DernierIndexResponse);
}

message CreateCampagneRequest {
  string nom = 1;
  int32 periode_mois = 2;
  int32 periode_annee = 3;
  string date_planifiee = 4;
  string created_by = 5;
  string numero_mobile_money = 6;
  bool generer_factures_auto = 7;
  bool envoyer_whatsapp_auto = 8;
  bool demarrer_maintenant = 9;
}

message SaisirIndexRequest {
  string campagne_id = 1;
  string abonne_id = 2;
  double nouveau_index = 3;
  string observation = 4;
  string agent_id = 5;         // = auteur_id (agent ou admin de secours)
  string auteur_username = 6;
  string auteur_role = 7;
}

// Correction d'un index déjà remonté (ADMIN ou SUPERVISEUR propriétaire).
// Rejoue les règles métier mais autorise un relevé déjà RELEVE.
message CorrigerReleveRequest {
  string campagne_id = 1;
  string abonne_id = 2;
  double nouveau_index = 3;
  string observation = 4;
  string auteur_id = 5;
  string auteur_username = 6;
  string auteur_role = 7;
}

message MarquerNonReleveRequest {
  string campagne_id = 1;
  string abonne_id = 2;
  string statut = 3;  // NON_RELEVE ou ESTIME
  string observation = 4;
  string agent_id = 5;
}

message CampagneIdRequest { string campagne_id = 1; }
message ReleveIdRequest { string releve_id = 1; }

message AjouterAbonnesCampagneRequest {
  string campagne_id = 1;
  repeated string abonne_ids = 2;
}
message ListRelevesTourneeRequest {
  string campagne_id = 1;
  string agent_id = 2;
}
message AjouterAbonnesResponse {
  int32 nb_ajoutes = 1;  // relevés A_RELEVER créés
  int32 nb_ignores = 2;  // abonnés déjà inscrits ou non ACTIF
}
message AbonneIdRequest { string abonne_id = 1; }

message CampagneResponse {
  string campagne_id = 1;
  string nom = 2;
  int32 periode_mois = 3;
  int32 periode_annee = 4;
  string statut = 5;
  string date_planifiee = 6;
  string date_creation = 7;
  string date_cloture = 8;
  string numero_mobile_money = 9;
  bool generer_factures_auto = 10;
  bool envoyer_whatsapp_auto = 11;
}

// Une entrée du journal d'audit d'un relevé (saisie initiale ou correction).
message ReleveAudit {
  string action = 1;          // SAISIE | CORRECTION
  string auteur_id = 2;
  string auteur_username = 3;
  string auteur_role = 4;
  double ancien_index = 5;    // index avant l'action (référence)
  double nouvel_index = 6;    // index posé par l'action
  string horodatage = 7;      // ISO 8601
}

message ReleveResponse {
  string releve_id = 1;
  string abonne_id = 2;
  double ancien_index = 3;
  double nouveau_index = 4;
  double consommation = 5;
  string date_releve = 6;
  string observation = 7;
  string statut = 8;
  string agent_id = 9;              // agent/admin ayant saisi (P3)
  repeated ReleveAudit audit = 10;  // journal SAISIE/CORRECTION (P1/P2)
  string quartier = 11;             // zone du compteur (snapshot à la création)
  int32 camp = 12;
}

// Une zone de relevé = une paire (quartier, camp).
message Zone {
  string quartier = 1;
  int32 camp = 2;
}

message AffecterZonesRequest {
  string campagne_id = 1;
  string agent_id = 2;
  repeated Zone zones = 3;  // remplace l'ensemble des zones de cet agent
}

// Une zone affectée à un agent, avec l'avancement des relevés de la zone.
message ZoneAffectee {
  string quartier = 1;
  int32 camp = 2;
  int32 nb_releves = 3;  // relevés RELEVE de la campagne dans cette zone
}

message AgentAffecte {
  string agent_id = 1;
  repeated ZoneAffectee zones = 2;
  int32 nb_releves = 3;          // total relevés RELEVE saisis par l'agent
  string derniere_activite = 4;  // ISO du dernier relevé de l'agent, "" si aucun
}

message ListAgentsCampagneResponse { repeated AgentAffecte agents = 1; }

message ProgressionResponse {
  string campagne_id = 1;
  int32 total_abonnes = 2;
  int32 nb_releves = 3;
  int32 nb_en_attente = 4;
  double pourcentage = 5;
}

// Aperçu prêt à afficher avant la clôture d'une campagne (modal de confirmation).
message ResumeClotureResponse {
  string campagne_id = 1;
  int32 total_abonnes = 2;
  int32 nb_releves = 3;            // statut RELEVE
  int32 nb_estimes = 4;           // statut ESTIME
  int32 nb_non_releves = 5;       // statut NON_RELEVE
  int32 nb_restants = 6;          // statut A_RELEVER (pas encore traités)
  int32 nb_factures_a_generer = 7; // relevés + estimés (les seuls facturés)
}

message DernierIndexResponse {
  string abonne_id = 1;
  double dernier_index = 2;
  bool est_index_initial = 3;
}

message ListCampagnesRequest {
  string created_by = 1;  // vide = pas de filtre propriétaire ; non-vide = filtre SUPERVISEUR
  string agent_id = 2;    // vide = pas de filtre agent ; non-vide = campagnes où l'agent est affecté
}

message AssignerAgentRequest {
  string campagne_id = 1;
  string agent_id = 2;
}

message ListCampagnesResponse { repeated CampagneResponse campagnes = 1; }
message ListRelevesResponse { repeated ReleveResponse releves = 1; }
message EmptyRequest {}
