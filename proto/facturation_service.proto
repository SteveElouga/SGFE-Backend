syntax = "proto3";
package facturation;

service FacturationService {
  rpc GenererFactures (GenererFacturesRequest) returns (GenererFacturesResponse);
  // Constate à la main une dette antérieure à la mise en service. Série de
  // numérotation propre (REG-), sans campagne ni index : son montant est
  // déclaré, pas calculé — d'où le motif obligatoire.
  rpc CreerRegularisation (CreerRegularisationRequest) returns (FactureResponse);
  // Annule une facture sans l'effacer : elle reste au journal avec son numéro,
  // son motif et l'auteur de l'annulation. Ce que l'abonné avait versé est
  // porté à son avoir.
  rpc AnnulerFacture (AnnulerFactureRequest) returns (FactureResponse);
  // Annule puis émet une facture corrigée à partir du relevé actuel — relu, et
  // non recopié : c'est ce qui permet à une correction d'index de produire la
  // facture juste.
  rpc RegenererFacture (RegenererFactureRequest) returns (RegenererFactureResponse);
  rpc GetFacture (FactureIdRequest) returns (FactureResponse);
  rpc ListFactures (ListFacturesRequest) returns (ListFacturesResponse);
  rpc GetFacturePDF (FactureIdRequest) returns (PDFResponse);
  // Bilan des impayés (document A4 agrégé) — back-office ADMIN/COMPTABLE.
  rpc GenererBilanImpayesPDF (EmptyRequest) returns (PDFResponse);
  // Synthèse chiffrée d'une campagne (stats 3 domaines via Reporting) — écran 13.
  rpc GenererSyntheseCampagnePDF (CampagneIdRequest) returns (PDFResponse);
  // Reçu d'un versement (document A5) — back-office ADMIN/COMPTABLE.
  rpc GenererRecuPaiementPDF (GenererRecuRequest) returns (PDFResponse);
  rpc UpdateStatutFacture (UpdateStatutRequest) returns (FactureResponse);
  rpc GetTarifActuel (EmptyRequest) returns (TarifResponse);
  rpc UpdateTarif (UpdateTarifRequest) returns (TarifResponse);
  rpc GetFacturesParCampagne (CampagneIdRequest) returns (ListFacturesResponse);
}

message GenererFacturesRequest {
  string campagne_id = 1;
  string numero_mobile_money = 2;
  bool envoyer_whatsapp_auto = 3;
}

message CreerRegularisationRequest {
  string abonne_id = 1;
  double montant = 2;
  string motif = 3;
  // Vide = exigible immédiatement : la dette date d'avant, elle n'a pas à
  // bénéficier d'un nouveau délai.
  string date_limite_paiement = 4;
}

message FactureIdRequest { string facture_id = 1; }
message CampagneIdRequest { string campagne_id = 1; }
message GenererRecuRequest {
  string paiement_id = 1;
  string facture_id = 2;
}

message ListFacturesRequest {
  string campagne_id = 1;
  string abonne_id = 2;
  string statut = 3;
  // Bornes de PÉRIODE (ISO `AAAA-MM-JJ`, incluses), sur la date de génération de
  // la facture. Vides = pas de borne.
  //
  // Sans elles, un export ne pouvait viser qu'une campagne — donc aucun journal
  // mensuel ni annuel, et les régularisations (`campagne_id` vide) étaient
  // exportables par AUCUN chemin. Or c'est la seule dette qu'on saisit à la
  // main : l'arriéré antérieur à la mise en service.
  //
  // La date de génération, et non `date_releve` : une régularisation n'a pas de
  // relevé. C'est la seule date que portent les deux natures de facture.
  string date_debut = 4;
  string date_fin = 5;
}

message UpdateStatutRequest {
  string facture_id = 1;
  string statut = 2;
}

message UpdateTarifRequest {
  double prix_m3 = 1;
  string date_effet = 2;
}

message FactureResponse {
  string facture_id = 1;
  string numero_facture = 2;
  string abonne_id = 3;
  string campagne_id = 4;
  double ancien_index = 5;
  double nouveau_index = 6;
  double consommation = 7;
  double prix_m3 = 8;
  double montant = 9;
  string statut = 10;
  string date_releve = 11;
  string date_limite_paiement = 12;
  string date_generation = 13;
  string pdf_path = 14;
  string numero_mobile_money = 15;
  // CONSOMMATION (issue d'un relevé) ou REGULARISATION (dette déclarée).
  // Sans ce champ, une régularisation est indistinguable d'une facture
  // ordinaire à qui il manquerait son relevé — ce que l'espace abonné
  // affichait littéralement : un montant, et un tiret à la place de l'index.
  string nature = 16;
  // Justification d'une régularisation. Vide pour une consommation.
  string motif = 17;
  // ── Annulation ─────────────────────────────────────────────────────────────
  string motif_annulation = 18;
  string date_annulation = 19;
  string annulee_par = 20;
  // Facture émise en remplacement de celle-ci (vide si aucune).
  string remplacee_par_id = 21;
  // Facture que celle-ci remplace (vide si elle n'en remplace aucune).
  string remplace_id = 22;
}

message TarifResponse {
  string tarif_id = 1;
  double prix_m3 = 2;
  string date_effet = 3;
  bool is_active = 4;
}

message PDFResponse {
  bytes pdf_content = 1;
  string filename = 2;
}

message GenererFacturesResponse { repeated FactureResponse factures = 1; }
message ListFacturesResponse { repeated FactureResponse factures = 1; }
message EmptyRequest {}

message AnnulerFactureRequest {
  string facture_id = 1;
  // Obligatoire : aucun index ne justifie la disparition d'une dette, la
  // phrase saisie est la seule trace de la raison.
  string motif = 2;
  string annule_par = 3;
}

message RegenererFactureRequest {
  string facture_id = 1;
  string motif = 2;
  string regenere_par = 3;
}

message RegenererFactureResponse {
  FactureResponse annulee = 1;
  FactureResponse nouvelle = 2;
}
