# Configuration "seed" partagée par les 3 instances Sentinel (voir
# docker-compose.yml, services redis-sentinel-1/2/3) — copiée une fois dans
# un volume inscriptible par chaque conteneur au démarrage (Sentinel réécrit
# ce fichier lui-même en fonctionnement normal : il lui faut un chemin
# accessible en écriture, jamais un montage :ro).
#
# Quorum = 2 (sur 3 sentinels) : au moins 2 instances doivent constater
# indépendamment l'indisponibilité du maître avant de déclencher une
# élection de failover — c'est ce qui protège d'un faux positif dû à un seul
# sentinel isolé par une partition réseau (voir README.md de ce dossier
# pour la discussion complète, y compris ce que ce POC NE fait PAS encore).
port 26379
# Par défaut, Sentinel n'accepte que des adresses IP littérales dans
# "sentinel monitor" (et refuse de démarrer sinon, voir "Can't resolve
# instance hostname"). En Docker, les noms de service (DNS interne) sont la
# seule adresse stable — les IP de conteneur changent à chaque recréation :
# ces deux options sont donc obligatoires ici, pas un simple raffinement.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor mymaster redis 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 60000
sentinel parallel-syncs mymaster 1
