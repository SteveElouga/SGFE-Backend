# DNS Docker interne : force la résolution périodique du nom "gateway"
# plutôt qu'une résolution unique au démarrage (via un `upstream` classique),
# pour éviter un 502 après chaque recréation du conteneur gateway (nouvelle IP).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    # Sonde de santé de nginx lui-même — ne dépend pas de la disponibilité
    # de la gateway en aval (utilisée par HEALTHCHECK/orchestrateur).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    location / {
        set $upstream_gateway gateway:8000;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
