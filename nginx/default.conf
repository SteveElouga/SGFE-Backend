# DNS Docker interne : force la résolution périodique du nom "gateway"
# plutôt qu'une résolution unique au démarrage (via un `upstream` classique),
# pour éviter un 502 après chaque recréation du conteneur gateway (nouvelle IP).
resolver 127.0.0.11 valid=10s;

# Limitation de débit par IP (anti-bruteforce login / bombing OTP-reset / DoS).
# ~30 req/s en régime avec tolérance de rafales — généreux pour l'usage UI
# légitime (une page GraphQL déclenche quelques requêtes), tout en coupant les
# floods. Le verrouillage PAR COMPTE (5 essais/15 min) reste géré côté auth-service.
limit_req_zone $binary_remote_addr zone=gw_limit:10m rate=30r/s;

# ─────────────────────────────────────────────────────────────────────────
# :80 — jamais de trafic applicatif en clair. Seuls trois usages légitimes :
#   1. La sonde de santé locale (HEALTHCHECK du conteneur, orchestrateur).
#   2. Le défi HTTP-01 de Let's Encrypt (certbot --webroot), en production —
#      voir scripts/renew-letsencrypt-cert.sh. Répertoire vide et inoffensif
#      en dev.
#   3. La redirection de tout le reste vers HTTPS.
# ─────────────────────────────────────────────────────────────────────────
server {
    listen 80;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────
# :443 — seul point d'entrée servant réellement le trafic API/GraphQL.
#
# Chemins de certificat identiques en dev et en production :
#   - Dev : certificat auto-signé, généré par ./scripts/generate-nginx-cert.sh
#     dans nginx/certs/ (gitignoré), monté par docker-compose.yml.
#   - Prod : cible documentée dans docs/CHAINE_DE_LIVRAISON.md (§1, §12
#     étape 6) — CloudFront devant (TLS public, ACM), Let's Encrypt sur cette
#     origine EC2. certbot nomme déjà ses fichiers fullchain.pem/privkey.pem
#     dans /etc/letsencrypt/live/<domaine>/ : docker-compose.prod.yml monte ce
#     dossier directement sur le même chemin, aucune adaptation ici.
#
# Sans ces deux fichiers, nginx refuse de démarrer — fail-fast voulu, même
# pattern que les clés JWT RS256 de auth-service (docker-compose.yml).
# ─────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Suites explicites (registre CONFORMITE_SOC2_OWASP.md, item 12) : uniquement
    # ECDHE + AEAD, aucun CBC/3DES. `ssl_ciphers` ne régit que TLSv1.2 et
    # antérieur ; TLSv1.3 négocie ses propres suites (déjà toutes AEAD par
    # spec) mais `ssl_conf_command Ciphersuites` (nginx >= 1.19.4, image
    # nginx:1.29-alpine ici) les explicite plutôt que de compter sur le
    # défaut OpenSSL.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    location / {
        # Rate limiting par IP : rafales courtes tolérées (burst), 429 au-delà.
        limit_req zone=gw_limit burst=60 nodelay;
        limit_req_status 429;

        # En-tête de sécurité posé à l'edge : le CSP (Django ne le gère pas
        # nativement). Les autres en-têtes (nosniff, Referrer-Policy,
        # X-Frame-Options) viennent de la gateway Django (SecurityMiddleware).
        # Politique stricte adaptée à une API/GraphQL ; à assouplir si des pages
        # HTML (ex. GraphiQL) doivent être servies via nginx.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        # HSTS : n'a de sens qu'une fois qu'on sait servir en HTTPS — posé
        # uniquement ici, jamais sur le bloc :80 (qui ne fait que rediriger).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        set $upstream_gateway gateway:8000;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
