services:
  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  auth-service:
    build: ./services/auth
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: dev-only-local-secret-change-me
      DJANGO_DEBUG: "True"
      AUTH_DB_HOST: auth-postgres
      AUTH_DB_PORT: "5432"
      AUTH_DB_NAME: auth_db
      AUTH_DB_USER: auth_user
      AUTH_DB_PASSWORD: devpassword
      AUTH_GRPC_PORT: "50051"
      JWT_SECRET_KEY: dev-only-local-secret-change-me
      BREVO_API_KEY: ${BREVO_API_KEY:-dev-fake-key}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-SGFE}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-no-reply@sgfe.example.com}
      FRONTEND_URL: http://localhost:4200
    ports:
      - "50051:50051"
    command: sh -c "python manage.py migrate && python manage.py grpc_server"

  abonne-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abonne_db
      POSTGRES_USER: abonne_user
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abonne_user -d abonne_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - abonne_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  abonne-service:
    build: ./services/abonne
    depends_on:
      abonne-postgres:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: dev-only-local-secret-change-me
      DJANGO_DEBUG: "True"
      ABONNE_DB_HOST: abonne-postgres
      ABONNE_DB_PORT: "5432"
      ABONNE_DB_NAME: abonne_db
      ABONNE_DB_USER: abonne_user
      ABONNE_DB_PASSWORD: devpassword
      ABONNE_GRPC_PORT: "50052"
    ports:
      - "50052:50052"
    command: sh -c "python manage.py migrate && python manage.py grpc_server"

  gateway:
    build: ./gateway
    depends_on:
      - auth-service
      - abonne-service
    environment:
      DJANGO_SECRET_KEY: dev-only-local-secret-change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: "50051"
      ABONNE_GRPC_HOST: abonne-service
      ABONNE_GRPC_PORT: "50052"
      GATEWAY_HTTP_PORT: "8000"
      COOKIE_SECURE: "False"
    expose:
      - "8000"

  nginx:
    build: ./nginx
    depends_on:
      - gateway
    ports:
      - "8080:80"

volumes:
  auth_postgres_data:
  abonne_postgres_data:
