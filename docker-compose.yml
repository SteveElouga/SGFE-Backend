services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  whatsapp-service:
    build: ./whatsapp-service
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_session:/app/session
    restart: unless-stopped

  auth-service:
    build: ./services/auth
    depends_on:
      auth-postgres:
        condition: service_healthy
      whatsapp-service:
        condition: service_started
    environment:
      DJANGO_SECRET_KEY: dev-only-local-secret-change-me
      DJANGO_DEBUG: "True"
      AUTH_DB_HOST: auth-postgres
      AUTH_DB_PORT: "5432"
      AUTH_DB_NAME: auth_db
      AUTH_DB_USER: auth_user
      AUTH_DB_PASSWORD: devpassword
      AUTH_GRPC_PORT: "50051"
      JWT_SECRET_KEY: dev-only-local-secret-change-me
      BREVO_API_KEY: ${BREVO_API_KEY:-dev-fake-key}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-SGFE}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-no-reply@sgfe.example.com}
      FRONTEND_URL: http://localhost:4200
      WHATSAPP_SERVICE_URL: http://whatsapp-service:3000
      PHONE_OTP_VALIDITY_MINUTES: "10"
    ports:
      - "50051:50051"
    command: sh -c "python manage.py migrate && python manage.py grpc_server"

  abonne-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abonne_db
      POSTGRES_USER: abonne_user
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abonne_user -d abonne_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - abonne_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  abonne-service:
    build: ./services/abonne
    depends_on:
      abonne-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: dev-only-local-secret-change-me
      DJANGO_DEBUG: "True"
      ABONNE_DB_HOST: abonne-postgres
      ABONNE_DB_PORT: "5432"
      ABONNE_DB_NAME: abonne_db
      ABONNE_DB_USER: abonne_user
      ABONNE_DB_PASSWORD: devpassword
      ABONNE_GRPC_PORT: "50052"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "50052:50052"
    command: sh -c "python manage.py migrate && python manage.py grpc_server"

  config-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: config_db
      POSTGRES_USER: config_user
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config_user -d config_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - config_postgres_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  config-service:
    build: ./services/config
    depends_on:
      config-postgres:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: dev-only-local-secret-change-me
      DJANGO_DEBUG: "True"
      CONFIG_DB_HOST: config-postgres
      CONFIG_DB_PORT: "5432"
      CONFIG_DB_NAME: config_db
      CONFIG_DB_USER: config_user
      CONFIG_DB_PASSWORD: devpassword
      CONFIG_GRPC_PORT: "50058"
    ports:
      - "50058:50058"
    command: sh -c "python manage.py migrate && python manage.py grpc_server"

  gateway:
    build: ./gateway
    depends_on:
      - auth-service
      - abonne-service
      - config-service
      - redis
    environment:
      DJANGO_SECRET_KEY: dev-only-local-secret-change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: "50051"
      ABONNE_GRPC_HOST: abonne-service
      ABONNE_GRPC_PORT: "50052"
      CONFIG_GRPC_HOST: config-service
      CONFIG_GRPC_PORT: "50058"
      GATEWAY_HTTP_PORT: "8000"
      COOKIE_SECURE: "False"
      REDIS_URL: "redis://redis:6379/0"
    expose:
      - "8000"

  nginx:
    build: ./nginx
    depends_on:
      - gateway
    ports:
      - "8080:80"

volumes:
  auth_postgres_data:
  abonne_postgres_data:
  config_postgres_data:
  whatsapp_session:
  redis_data:
