  db-backup:
    image: postgres:16-alpine
    depends_on:
      auth-postgres:
        condition: service_healthy
      abonne-postgres:
        condition: service_healthy
      campagne-postgres:
        condition: service_healthy
      facturation-postgres:
        condition: service_healthy
      paiement-postgres:
        condition: service_healthy
      notification-postgres:
        condition: service_healthy
      config-postgres:
        condition: service_healthy
      reporting-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      RETENTION_DAYS: "7"
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY requis pour chiffrer les sauvegardes}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-databases.sh:/backup.sh:ro
    # `apk add openssl` : postgres:16-alpine embarque libssl3/libcrypto3 (dépendance
    # de postgres lui-même) mais PAS le binaire CLI `openssl` — vérifié empiriquement
    # (`which openssl` échoue sur l'image nue). Sans ce paquet, backup-databases.sh
    # échouerait au moment de chiffrer chaque dump. Installé une fois au démarrage,
    # avant la boucle quotidienne.
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl && while true; do sh /backup.sh || true; sleep 86400; done"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

# ── Réseaux ──────────────────────────────────────────────────────────────────
#
# Cette pile crée `sgfe-edge` ; la pile frontend le déclare `external: true` et
# s'y raccroche. La dépendance va donc dans un seul sens — le frontend a besoin
# de l'API, l'inverse n'est pas vrai — et l'ordre de démarrage suit : **cette
# pile d'abord**, sinon `docker compose up` côté frontend échoue en disant que le
# réseau n'existe pas. C'est un échec lisible, et de loin préférable à un nginx
# qui démarre et sert des 502.
#
# Le nom est fixé explicitement : sans `name`, Compose le préfixerait du nom du
# projet (`sgfe-backend_edge`), qui dépend du nom du dossier sur la machine — le
# frontend ne pourrait pas s'y référer de façon stable.
networks:
  edge:
    name: sgfe-edge

volumes:
  auth_postgres_data:
  abonne_postgres_data:
  campagne_postgres_data:
  facturation_postgres_data:
  facturation_pdfs:
  paiement_postgres_data:
  notification_postgres_data:
  config_postgres_data:
  reporting_postgres_data:
  whatsapp_session:
  redis_data:
