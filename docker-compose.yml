# ── Restart policy & limites de ressources ────────────────────────────────
#
# `restart: unless-stopped` sur tous les services : un redémarrage de l'hôte
# ou un crash isolé ne doit pas laisser un service arrêté silencieusement.
#
# `deploy.resources.limits` : vérifié empiriquement (2026-09-03) que ces clés
# sont bien honorées par `docker compose up` classique (Compose v2, hors
# swarm) — `docker inspect --format '{{.HostConfig.Memory}}'` sur un conteneur
# de test avec `limits.memory: 128M` / `cpus: "0.5"` renvoie 134217728 (128M
# exacts) et NanoCPUs=500000000 (0.5 cpu) : les limites deviennent bien des
# limites cgroup réelles sur le conteneur, pas un no-op réservé à `docker
# stack deploy`.
#
# Barème choisi par rôle :
#   - postgres (8 instances)   : 512M / 1 cpu   — bases par service, faible volumétrie
#   - services Django (8 gRPC) : 512M / 1 cpu   — profil homogène, pas de traitement lourd en mémoire
#   - gateway                  : 768M / 1.5 cpu — agrège les 8 appels gRPC + tient les subscriptions WebSocket
#   - whatsapp-service         : 1.5G  / 1.5 cpu — Chromium (whatsapp-web.js) ; l'audit mesure ~929 Mo réels,
#                                                   marge au-delà du plancher de 1.2G demandé pour absorber les pics
#   - redis                    : 256M / 0.5 cpu — cache + pub/sub, faible empreinte
#   - nginx                    : 128M / 0.5 cpu — reverse proxy, pas de traitement
#   - db-backup                : 256M / 0.5 cpu — pg_dump + gzip séquentiel, pic bref une fois par jour
services:
  redis:
    image: redis:7-alpine
    # Persistance AOF activée : la session WhatsApp (RemoteAuth) et le cache
    # survivent à un redémarrage de Redis. Sans ce montage, le volume redis_data
    # déclaré plus bas restait inutilisé et les données étaient éphémères.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  whatsapp-service:
    build: ./whatsapp-service
    depends_on:
      redis:
        condition: service_healthy
    environment:
      WHATSAPP_INTERNAL_API_KEY: ${WHATSAPP_INTERNAL_API_KEY:-whatsapp-dev-placeholder-do-not-use-in-production}
      # RemoteAuth persiste la session WhatsApp dans Redis (voir whatsapp-service/redis-store.js)
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_session:/app/session
    restart: unless-stopped
    # Laisse à Chromium le temps de se fermer proprement sur `docker stop` (le
    # défaut de 10 s peut être trop court) — voir le handler SIGTERM de server.js.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.5"

  auth-service:
    build: ./services/auth
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-service:
        condition: service_started
    environment:
      DJANGO_SECRET_KEY: django-insecure-placeholder-do-not-use-in-production
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:-grpc-dev-placeholder-do-not-use-in-production}
      DJANGO_DEBUG: "True"
      AUTH_DB_HOST: auth-postgres
      AUTH_DB_PORT: "5432"
      AUTH_DB_NAME: auth_db
      AUTH_DB_USER: auth_user
      AUTH_DB_PASSWORD: devpassword
      AUTH_GRPC_PORT: "50051"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET_KEY: jwt-dev-placeholder-do-not-use-in-production
      BREVO_API_KEY: ${BREVO_API_KEY:-dev-fake-key}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-SGFE}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-no-reply@sgfe.example.com}
      FRONTEND_URL: http://localhost:4321
      WHATSAPP_SERVICE_URL: http://whatsapp-service:3000
      WHATSAPP_INTERNAL_API_KEY: ${WHATSAPP_INTERNAL_API_KEY:-whatsapp-dev-placeholder-do-not-use-in-production}
      PHONE_OTP_VALIDITY_MINUTES: "10"
      GRPC_TLS_CA: /app/certs/ca.crt
      GRPC_TLS_CERT: /app/certs/server.crt
      GRPC_TLS_KEY: /app/certs/server.key
    command: sh -c "python manage.py migrate && python manage.py grpc_server"
    volumes:
      # Clés JWT RS256 (gitignorées) : à générer via ./scripts/gen-jwt-keys.sh en
      # local, fournies par le secrets manager en prod. Sans elles, l'auth-service
      # refuse de démarrer (fail-fast RS256).
      - ./services/auth/keys:/app/keys:ro
      # CA + certificat mTLS gRPC interne (gitignorés) : à générer via
      # ./scripts/generate-grpc-certs.sh en local. Absents -> repli en clair
      # (voir comptes/grpc_auth.py), jamais un échec au démarrage.
      - ./certs:/app/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  abonne-postgres:
