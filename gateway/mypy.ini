[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main
# proto/ : stubs gRPC générés par grpc_tools.protoc (voir les *_pb2.py listés
# plus bas, dont l'import est ignoré) — exclu par cohérence, rien à typer.
# Pas de migrations : le gateway n'a pas de base de données (ASGI + GraphQL).
exclude = (^|/)(proto/)

# Décorateurs de resolvers strawberry — `@strawberry.field()`/`.mutation()`/
# `.subscription()` **avec parenthèses**, jamais nus.
#
# strawberry type le décorateur nu (`@strawberry.field`, sans appel) pour
# renvoyer un `StrawberryField` précis — correct pour la construction du
# schéma GraphQL, mais qui masque la signature de la méthode décorée pour
# tout appel direct. Ce dépôt teste ses resolvers en les appelant directement
# (`CampagneMutations().ma_mutation(info, ...)`), sans exécuter de requête
# GraphQL : avec le décorateur nu, `mypy --strict` voit alors l'appel comme
# "Unexpected keyword argument ... for __call__ of StrawberryField" et son
# retour comme inutilisable (ni attribut, ni indexable, ni itérable).
#
# La forme appelée (`@strawberry.field()`) correspond à un autre overload de
# strawberry, qui renvoie `Any` plutôt que `StrawberryField` — l'appel direct
# redevient donc typable dans les tests, au prix d'un `Any` sur le décorateur
# lui-même, que `--strict` (disallow_untyped_decorators) signale sur chaque
# site de décoration. C'est ce signalement, et lui seul, qu'ignore le
# `# type: ignore[untyped-decorator]` répété sur chaque resolver : aucune des
# deux formes de strawberry ne peut typer correctement les deux usages à la
# fois (schéma GraphQL et appel direct en test), et l'appel direct est le
# plus fréquent des deux ici.

[mypy.plugins.django-stubs]
django_settings_module = gateway.settings

[mypy-grpc.*]
ignore_missing_imports = True

[mypy-strawberry.*]
ignore_missing_imports = True

[mypy-environ]
ignore_missing_imports = True

[mypy-abonne_service_pb2]
ignore_missing_imports = True

