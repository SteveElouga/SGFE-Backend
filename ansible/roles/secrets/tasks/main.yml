---
# Écrit /opt/sgfe/.env depuis AWS Secrets Manager.
#
# ⚠️ AUCUN SECRET NE TRANSITE PAR ANSIBLE.
#
# C'est la machine qui lit Secrets Manager, avec son propre profil d'instance.
# Ansible ne fait qu'ordonner la lecture : les valeurs ne passent jamais par le
# poste qui lance le playbook, ni par la sortie d'exécution, ni par un fichier
# de vault qu'il faudrait ensuite protéger à son tour.
#
# Conséquence pratique : la sortie de ces tâches est muette (`no_log`), et c'est
# voulu. Un playbook qui affiche ce qu'il écrit dans un `.env` transforme chaque
# journal d'exécution en fuite.
#
# ── Inventaire (3 sept. 2026) ────────────────────────────────────────────────
# Comparé à tout `${VAR}`/`${VAR:-défaut}` de docker-compose.yml +
# docker-compose.prod.yml, tout `env(...)` sans défaut sûr des 9 `settings.py`
# (gateway + 8 services), et tout secret lu par les autres rôles Ansible
# (`compose/tasks/main.yml` lit `GHCR_TOKEN`/`GHCR_USER` depuis ce même `.env`
# pour `docker login`, alors qu'ils n'apparaissaient nulle part dans cette
# liste jusqu'ici).
#
# Secrets EFFECTIVEMENT consommés aujourd'hui (interpolés via `${VAR}` dans les
# compose, ou lus par un rôle Ansible) — c'est le jeu minimal, vérifié plus bas :
#   DJANGO_SECRET_KEY          — partagé par les 9 services (gateway + 8) ; TOUS
#                                 lisent `env("DJANGO_SECRET_KEY")` sans défaut
#                                 (fail-fast Django). Une seule valeur pour tous
#                                 aujourd'hui — voir limite ci-dessous.
#   INTERNAL_GRPC_KEY           — couche gRPC interne, partagée par les 9 services
#   BREVO_API_KEY               — auth-service (e-mails d'activation/reset)
#   WHATSAPP_INTERNAL_API_KEY   — whatsapp-service, auth-service, notification-service
#   BACKUP_ENCRYPTION_KEY       — db-backup (chiffrement des dumps, voir
#                                 scripts/backup-databases.sh)
#   FRONTEND_URL                 — obligatoire en prod (docker-compose.prod.yml
#                                 `${FRONTEND_URL:?...}`) sur auth-service et
#                                 notification-service ; pas un secret à
#                                 proprement parler, mais fail-fast comme les
#                                 secrets et provisionné par le même mécanisme
#   POSTGRES_PASSWORD            — lu par `db-backup` (`PGPASSWORD`) pour se
#                                 connecter aux 8 bases ; voir limite ci-dessous
#   GHCR_REPO, IMAGE_TAG          — docker-compose.prod.yml (référence d'image)
#   GHCR_USER, GHCR_TOKEN         — lus par ansible/roles/compose (docker login,
#                                 jeton `read:packages` seul) ; absents de cette
#                                 liste jusqu'ici alors que ce rôle en dépend
#
# ⚠️ LIMITE CONNUE (non corrigée ici, hors périmètre "rôle secrets") : dans
# docker-compose.yml, DJANGO_SECRET_KEY et POSTGRES_PASSWORD (sur chacune des 8
# instances Postgres) sont des valeurs LITTÉRALES codées en dur
# (`django-insecure-placeholder-do-not-use-in-production`, `devpassword`), pas
# des `${VAR}` interpolés — contrairement à INTERNAL_GRPC_KEY/BREVO_API_KEY/
# WHATSAPP_INTERNAL_API_KEY qui le sont déjà. Résultat : provisionner
# DJANGO_SECRET_KEY / POSTGRES_PASSWORD dans Secrets Manager et les écrire dans
# `.env` ne change AUJOURD'HUI rien au comportement des conteneurs concernés —
# seul `db-backup` lit réellement `POSTGRES_PASSWORD` via `${POSTGRES_PASSWORD:-devpassword}`.
# Un secret par service (`AUTH_DB_PASSWORD`, `ABONNE_DB_PASSWORD`, ...,
# `DJANGO_SECRET_KEY_AUTH`, `DJANGO_SECRET_KEY_ABONNE`, ...) est la cible
# correcte, mais suppose de faire interpoler ces mêmes noms dans
# docker-compose.yml — un changement distinct, plus large, qui n'est pas fait
# par ce rôle. Documenté ici pour que « le coffre est branché » ne masque pas
# « les mots de passe de base ne sont pas encore isolés par service ».
#
# JWT_SECRET_KEY, présent dans docker-compose.yml sur 5 services, est du code
# mort : auth-service signe en RS256 avec une paire de clés fichiers
# (`services/auth/keys/jwt_private.pem`/`jwt_public.pem`), jamais avec ce
# secret symétrique (voir services/auth/auth/settings.py, section RS256).
# Cette paire est générée SUR la machine par `ansible/roles/compose` — elle ne
# transite jamais par Secrets Manager ni par ce rôle. Volontairement absent de
# la liste ci-dessous : l'y ajouter provisionnerait un secret que rien ne lit.

- name: Répertoire de déploiement
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

- name: Le jeu de secrets attendu existe-t-il ?
  # Échouer ici, avec le nom de ce qui manque, plutôt que d'écrire un `.env`
  # incomplet dont les services révéleront l'absence en refusant de démarrer
  # — trois minutes plus tard, avec un message moins clair.
  ansible.builtin.command: >-
    aws secretsmanager describe-secret
      --secret-id sgfe/production
      --region {{ aws_region }}
  register: secrets_description_secret
  changed_when: false
  failed_when: false

- name: Refuser de continuer si le jeu de secrets n'est pas créé
  ansible.builtin.assert:
    that:
      - secrets_description_secret.rc == 0
    fail_msg: |
      Le secret `sgfe/production` n'existe pas dans Secrets Manager ({{ aws_region }}).

      Il doit contenir un objet JSON dont chaque clé devient une ligne du .env.
      Jeu minimal (voir l'inventaire en tête de ce fichier pour le détail et
      les limites connues) :

        {
          "DJANGO_SECRET_KEY": "…",
          "INTERNAL_GRPC_KEY": "…",
          "BREVO_API_KEY": "…",
          "WHATSAPP_INTERNAL_API_KEY": "…",
          "BACKUP_ENCRYPTION_KEY": "…",
          "FRONTEND_URL": "https://…",
          "POSTGRES_PASSWORD": "…",
          "GHCR_REPO": "{{ ghcr_repo }}",
          "IMAGE_TAG": "…",
          "GHCR_USER": "…",
          "GHCR_TOKEN": "…"
        }

      Rappel (non résolu par ce rôle) : chaque service devrait avoir SON mot
      de passe de base et SA clé Django — aujourd'hui les 9 services partagent
      la même DJANGO_SECRET_KEY, et docker-compose.yml code `devpassword` en
      dur sur les 8 instances Postgres au lieu de lire POSTGRES_PASSWORD (seul
      `db-backup` la lit réellement). Isoler ces secrets par service suppose
      de faire aussi évoluer docker-compose.yml — hors périmètre ici.
    quiet: true

- name: Écrire le .env depuis Secrets Manager
  # `--query SecretString` puis `to_entries` : chaque clé du JSON devient une
  # ligne `CLE=valeur`. Le fichier est en 0600 et appartient à l'utilisateur de
  # déploiement — il porte tous les identifiants de la production. Générique :
  # aucune clé n'est énumérée ici, donc ajouter un secret ne demande de
  # modifier que le contenu de `sgfe/production`, jamais cette tâche.
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    aws secretsmanager get-secret-value \
      --secret-id sgfe/production \
      --region {{ aws_region }} \
      --query SecretString --output text \
    | python3 -c 'import json,sys; [print(f"{k}={v}") for k,v in json.load(sys.stdin).items()]' \
    > {{ deploy_dir }}/.env.nouveau
    # Écriture atomique : un `.env` tronqué par une coupure au milieu de la
    # redirection laisserait les services démarrer avec la moitié de leurs
    # identifiants.
    mv {{ deploy_dir }}/.env.nouveau {{ deploy_dir }}/.env
  args:
    executable: /bin/bash
  no_log: true
  changed_when: true

- name: Droits du .env
  ansible.builtin.file:
    path: "{{ deploy_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

- name: Vérifier que les variables indispensables au déploiement sont là
  # On contrôle la PRÉSENCE des clés, jamais leur valeur : `grep -q` teste,
  # il n'affiche pas. Liste alignée sur l'inventaire en tête de ce fichier —
  # uniquement les clés EFFECTIVEMENT interpolées par un compose ou lues par
  # un autre rôle Ansible aujourd'hui (GHCR_USER/GHCR_TOKEN inclus : sans eux,
  # `roles/compose` échoue au `docker login`, plus loin dans le déploiement,
  # avec un message bien moins clair qu'ici).
  ansible.builtin.shell: |
    set -euo pipefail
    manquantes=""
    for cle in \
      DJANGO_SECRET_KEY \
      INTERNAL_GRPC_KEY \
      BREVO_API_KEY \
      WHATSAPP_INTERNAL_API_KEY \
      BACKUP_ENCRYPTION_KEY \
      FRONTEND_URL \
      POSTGRES_PASSWORD \
      GHCR_REPO \
      IMAGE_TAG \
      GHCR_USER \
      GHCR_TOKEN \
    ; do
      grep -q "^${cle}=" {{ deploy_dir }}/.env || manquantes="$manquantes $cle"
    done
    if [ -n "$manquantes" ]; then
      echo "Variable(s) manquante(s) dans {{ deploy_dir }}/.env :$manquantes"
      exit 1
    fi
  args:
    executable: /bin/bash
  changed_when: false
