---
# Écrit /opt/sgfe/.env depuis AWS Secrets Manager.
#
# ⚠️ AUCUN SECRET NE TRANSITE PAR ANSIBLE.
#
# C'est la machine qui lit Secrets Manager, avec son propre profil d'instance.
# Ansible ne fait qu'ordonner la lecture : les valeurs ne passent jamais par le
# poste qui lance le playbook, ni par la sortie d'exécution, ni par un fichier
# de vault qu'il faudrait ensuite protéger à son tour.
#
# Conséquence pratique : la sortie de ces tâches est muette (`no_log`), et c'est
# voulu. Un playbook qui affiche ce qu'il écrit dans un `.env` transforme chaque
# journal d'exécution en fuite.

- name: Répertoire de déploiement
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

- name: Le jeu de secrets attendu existe-t-il ?
  # Échouer ici, avec le nom de ce qui manque, plutôt que d'écrire un `.env`
  # incomplet dont les services révéleront l'absence en refusant de démarrer
  # — trois minutes plus tard, avec un message moins clair.
  ansible.builtin.command: >-
    aws secretsmanager describe-secret
      --secret-id sgfe/production
      --region {{ aws_region }}
  register: secrets_description_secret
  changed_when: false
  failed_when: false

- name: Refuser de continuer si le jeu de secrets n'est pas créé
  ansible.builtin.assert:
    that:
      - secrets_description_secret.rc == 0
    fail_msg: |
      Le secret `sgfe/production` n'existe pas dans Secrets Manager ({{ aws_region }}).

      Il doit contenir un objet JSON dont chaque clé devient une ligne du .env :

        {
          "DJANGO_SECRET_KEY_AUTH": "…",
          "AUTH_DB_PASSWORD": "…",
          "INTERNAL_GRPC_KEY": "…",
          "WHATSAPP_INTERNAL_API_KEY": "…",
          "BREVO_API_KEY": "…",
          "FRONTEND_URL": "https://…",
          "GHCR_REPO": "{{ ghcr_repo }}",
          "IMAGE_TAG": "…"
        }

      L'inventaire complet des 43 affectations de secret est dans l'artefact
      « Six Secrets ». Rappel : chaque service doit avoir SON mot de passe de
      base et SA clé Django — aujourd'hui les huit bases partagent la même.
    quiet: true

- name: Écrire le .env depuis Secrets Manager
  # `--query SecretString` puis `to_entries` : chaque clé du JSON devient une
  # ligne `CLE=valeur`. Le fichier est en 0600 et appartient à l'utilisateur de
  # déploiement — il porte tous les identifiants de la production.
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    aws secretsmanager get-secret-value \
      --secret-id sgfe/production \
      --region {{ aws_region }} \
      --query SecretString --output text \
    | python3 -c 'import json,sys; [print(f"{k}={v}") for k,v in json.load(sys.stdin).items()]' \
    > {{ deploy_dir }}/.env.nouveau
    # Écriture atomique : un `.env` tronqué par une coupure au milieu de la
    # redirection laisserait les services démarrer avec la moitié de leurs
    # identifiants.
    mv {{ deploy_dir }}/.env.nouveau {{ deploy_dir }}/.env
  args:
    executable: /bin/bash
  no_log: true
  changed_when: true

- name: Droits du .env
  ansible.builtin.file:
    path: "{{ deploy_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

- name: Vérifier que les variables indispensables au déploiement sont là
  # On contrôle la PRÉSENCE des clés, jamais leur valeur : `grep -c` compte,
  # il n'affiche pas. Sans `GHCR_REPO` et `IMAGE_TAG`, le compose de production
  # refuse de s'interpoler — mieux vaut le savoir ici.
  ansible.builtin.shell: |
    set -euo pipefail
    for cle in GHCR_REPO IMAGE_TAG INTERNAL_GRPC_KEY; do
      grep -q "^${cle}=" {{ deploy_dir }}/.env || { echo "$cle manquante"; exit 1; }
    done
  args:
    executable: /bin/bash
  changed_when: false
