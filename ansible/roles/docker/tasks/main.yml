---
# Le moteur Docker, son plugin compose, et un utilisateur non-root.
#
# Ce savoir n'existe nulle part aujourd'hui : la machine de développement a
# Docker parce que quelqu'un l'a installé un jour. C'est ce que ce rôle rend
# reproductible.

- name: Paquets nécessaires au dépôt Docker
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true

- name: Clé du dépôt Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Dépôt Docker
  # `dpkg --print-architecture` plutôt qu'une constante : la même ligne sert sur
  # arm64 (Graviton) et amd64, et l'instance peut basculer d'une architecture à
  # l'autre tant que les images multi-plateformes ne sont pas publiées.
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('aarch64', 'arm64') | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Moteur Docker et plugin compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Service Docker démarré et activé au démarrage
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Utilisateur de déploiement
  # Les conteneurs tournent sous cet utilisateur, pas sous root. Les Dockerfiles
  # posent déjà un `USER` non privilégié à l'intérieur des images ; celui-ci
  # couvre ce qui est à l'extérieur — les fichiers compose, le `.env`, les
  # journaux.
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
    shell: /bin/bash
    state: present

- name: Rotation des journaux Docker
  # Sans cette limite, les journaux JSON d'un conteneur grossissent jusqu'à
  # remplir le disque. Sur une instance de 30 Gio, `whatsapp-service` y arrive :
  # il journalise chaque tentative de reconnexion, et une panne de Chromium en
  # produit plusieurs par minute.
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "20m", "max-file": "5" }
      }
  notify: Redémarrer Docker
